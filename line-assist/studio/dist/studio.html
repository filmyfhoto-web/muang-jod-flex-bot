<title>Reply Studio ร้านนัฐภรณ์</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: three columns (rules | editor | phone), a one-screen tool. On a phone the columns become three pages. */
:root {
  --bg: #edf1f4;
  --panel: #ffffff;
  --panel-2: #f5f7f9;
  --line: #e0e5ea;
  --line-2: #cdd5dc;
  --ink: #16202a;
  --ink-2: #56626f;
  --ink-3: #85919e;
  --accent: #06c755;
  --accent-2: #05a548;
  --accent-ink: #ffffff;
  --accent-soft: #e3f8eb;
  --accent-line: #9ddfb7;
  --info: #2a67e0;
  --info-soft: #e6eefd;
  --warn: #b86e00;
  --warn-soft: #fff2d4;
  --bad: #d3342a;
  --bad-soft: #fdebe9;
  --ok: #0c8a46;
  --ok-soft: #e3f8eb;
  --violet: #7347d1;
  --violet-soft: #efe9fc;
  --orange: #bd530b;
  --orange-soft: #ffeee0;
  --chat-bg: #8ea6d3;
  --bubble-me: #8ce04f;
  --bubble-bot: #ffffff;
  --shadow: 0 1px 2px rgba(20, 30, 40, 0.06), 0 6px 18px rgba(20, 30, 40, 0.06);
  --font: 'IBM Plex Sans Thai', 'Noto Sans Thai', 'Leelawadee UI', Tahoma, system-ui, sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #0d1217;
    --panel: #151c23;
    --panel-2: #1a232b;
    --line: #25303a;
    --line-2: #34414d;
    --ink: #e7ecf0;
    --ink-2: #a6b2bd;
    --ink-3: #78858f;
    --accent: #1fd068;
    --accent-2: #3be07e;
    --accent-ink: #04200f;
    --accent-soft: #11301f;
    --accent-line: #1f6b42;
    --info: #7aa5ff;
    --info-soft: #17274a;
    --warn: #f0b34a;
    --warn-soft: #3a2b0e;
    --bad: #ff7d72;
    --bad-soft: #3d1a17;
    --ok: #46d98a;
    --ok-soft: #11301f;
    --violet: #b79bff;
    --violet-soft: #2a2050;
    --orange: #ffa766;
    --orange-soft: #3a2314;
    --chat-bg: #27364f;
    --bubble-me: #5fbf3a;
    --bubble-bot: #2d3743;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 22px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #0d1217;
  --panel: #151c23;
  --panel-2: #1a232b;
  --line: #25303a;
  --line-2: #34414d;
  --ink: #e7ecf0;
  --ink-2: #a6b2bd;
  --ink-3: #78858f;
  --accent: #1fd068;
  --accent-2: #3be07e;
  --accent-ink: #04200f;
  --accent-soft: #11301f;
  --accent-line: #1f6b42;
  --info: #7aa5ff;
  --info-soft: #17274a;
  --warn: #f0b34a;
  --warn-soft: #3a2b0e;
  --bad: #ff7d72;
  --bad-soft: #3d1a17;
  --ok: #46d98a;
  --ok-soft: #11301f;
  --violet: #b79bff;
  --violet-soft: #2a2050;
  --orange: #ffa766;
  --orange-soft: #3a2314;
  --chat-bg: #27364f;
  --bubble-me: #5fbf3a;
  --bubble-bot: #2d3743;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 22px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}
html,
body {
  height: 100%;
}
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.45;
  scrollbar-width: thin;
}
button,
input,
textarea,
select {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
h2,
h3,
p {
  margin: 0;
}
svg {
  flex: none;
}

#app {
  height: 100%;
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---- header ---- */
.top {
  display: flex;
  align-items: center;
  gap: 12px 18px;
  flex-wrap: wrap;
  padding-block: 10px 6px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.logo {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  background: var(--accent);
  color: var(--accent-ink);
  display: grid;
  place-items: center;
  box-shadow: var(--shadow);
}
.brand-t {
  display: flex;
  flex-direction: column;
  line-height: 1.2;
  min-width: 0;
}
.brand-t b {
  font-size: 16px;
  letter-spacing: 0.1px;
}
.brand-t small {
  color: var(--ink-2);
  font-size: 12px;
}
.tabs {
  display: flex;
  gap: 4px;
  padding: 4px;
  border-radius: 12px;
  background: var(--panel);
  border: 1px solid var(--line);
  overflow-x: auto;
  max-width: 100%;
  scrollbar-width: none;
  box-shadow: var(--shadow);
}
.tab {
  border: 0;
  background: transparent;
  color: var(--ink-2);
  padding: 7px 12px;
  border-radius: 9px;
  white-space: nowrap;
  font-weight: 500;
}
.tab:hover {
  background: var(--panel-2);
}
.tab.on {
  background: var(--accent-soft);
  color: var(--ok);
  font-weight: 600;
}
.actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.dirty {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
  color: var(--warn);
  font-weight: 600;
}
.dirty i {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--warn);
}
.savecfm {
  font-size: 12.5px;
  color: var(--ink-2);
}

/* ---- common bits ---- */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 2px 9px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  background: var(--panel-2);
  color: var(--ink-2);
  border: 1px solid var(--line);
  white-space: nowrap;
}
.pill.ok,
.pill.on {
  background: var(--ok-soft);
  color: var(--ok);
  border-color: transparent;
}
.pill.info {
  background: var(--info-soft);
  color: var(--info);
  border-color: transparent;
}
.pill.warn {
  background: var(--warn-soft);
  color: var(--warn);
  border-color: transparent;
}
.pill.bad {
  background: var(--bad-soft);
  color: var(--bad);
  border-color: transparent;
}
.pill.off {
  background: var(--panel-2);
  color: var(--ink-3);
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: 1px solid transparent;
  border-radius: 10px;
  padding: 8px 14px;
  font-weight: 600;
  white-space: nowrap;
  transition: background 0.12s, border-color 0.12s, transform 0.05s;
}
.btn:active:not(:disabled) {
  transform: translateY(1px);
}
.btn-primary {
  background: var(--accent);
  color: var(--accent-ink);
}
.btn-primary:hover:not(:disabled) {
  background: var(--accent-2);
}
.btn-soft {
  background: var(--accent-soft);
  color: var(--ok);
}
.btn-soft:hover:not(:disabled) {
  border-color: var(--accent-line);
}
.btn-ghost {
  background: var(--panel);
  border-color: var(--line-2);
  color: var(--ink);
}
.btn-ghost:hover:not(:disabled) {
  background: var(--panel-2);
}
.btn-sm {
  padding: 5px 10px;
  font-size: 12.5px;
  border-radius: 8px;
}
.iconbtn {
  width: 30px;
  height: 30px;
  display: inline-grid;
  place-items: center;
  border-radius: 8px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--ink-2);
  padding: 0;
}
.iconbtn:hover:not(:disabled) {
  background: var(--panel-2);
  border-color: var(--line);
  color: var(--ink);
}
.iconbtn.danger:hover:not(:disabled) {
  color: var(--bad);
  background: var(--bad-soft);
  border-color: transparent;
}
.iconbtn.light {
  color: #fff;
}
.iconbtn.light:hover {
  background: rgba(255, 255, 255, 0.18);
  color: #fff;
}
.seg {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 2px;
  padding: 3px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 10px;
}
.seg button {
  border: 0;
  background: transparent;
  padding: 6px 11px;
  border-radius: 8px;
  color: var(--ink-2);
  font-weight: 500;
}
.seg button.on {
  background: var(--panel);
  color: var(--ink);
  font-weight: 600;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
}
.seg-sm button {
  padding: 3px 9px;
  font-size: 12.5px;
}
.input {
  width: 100%;
  background: var(--panel);
  border: 1px solid var(--line-2);
  border-radius: 9px;
  padding: 8px 11px;
  min-width: 0;
}
.input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
}
.area {
  resize: vertical;
  line-height: 1.5;
}
.mono {
  font-family: var(--mono);
  font-size: 12.5px;
  line-height: 1.45;
  white-space: pre;
}
.switch {
  position: relative;
  display: inline-block;
  width: 36px;
  height: 20px;
  flex: none;
}
.switch input {
  position: absolute;
  inset: 0;
  opacity: 0;
  margin: 0;
  cursor: pointer;
  width: 100%;
  height: 100%;
}
.switch i {
  position: absolute;
  inset: 0;
  border-radius: 999px;
  background: var(--line-2);
  transition: background 0.15s;
  pointer-events: none;
}
.switch i::after {
  content: '';
  position: absolute;
  left: 2px;
  top: 2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
  transition: transform 0.15s;
}
.switch input:checked + i {
  background: var(--accent);
}
.switch input:checked + i::after {
  transform: translateX(16px);
}
.switch input:focus-visible + i {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.toggle {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  flex: none;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
}
.muted {
  color: var(--ink-3);
}
.sub {
  color: var(--ink-2);
  font-size: 13px;
  margin-top: 2px;
}
.note {
  background: var(--panel-2);
  border: 1px dashed var(--line-2);
  border-radius: 10px;
  padding: 10px 12px;
  color: var(--ink-2);
}
.note.warn {
  border-color: var(--warn);
  color: var(--warn);
  background: var(--warn-soft);
}
.banner {
  display: flex;
  gap: 9px;
  align-items: flex-start;
  padding: 10px 12px;
  border-radius: 10px;
  margin-bottom: 12px;
  background: var(--warn-soft);
  color: var(--warn);
}
.banner.bad {
  background: var(--bad-soft);
  color: var(--bad);
}
.live-dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  margin-right: 8px;
  vertical-align: middle;
}

/* ---- the three columns ---- */
.grid {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 340px minmax(0, 1fr) 392px;
  gap: 14px;
  padding-block: 8px 14px;
}
.col {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  min-height: 0;
  min-width: 0;
  overflow: hidden;
}
.col-title {
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: 0.2px;
  color: var(--ink-2);
  display: flex;
  align-items: baseline;
  gap: 6px;
}
.col-title small {
  font-weight: 500;
  color: var(--ink-3);
}
.pal-sec,
.list-sec {
  padding: 14px 14px 0;
}
.list-sec {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding-bottom: 10px;
}
.palette {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 7px;
  margin: 9px 0 14px;
}
.pal {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  padding: 9px 2px 7px;
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 11px;
  font-size: 12px;
  color: var(--ink-2);
  cursor: grab;
  transition: border-color 0.12s, transform 0.12s, box-shadow 0.12s;
}
.pal:hover {
  border-color: var(--accent-line);
  transform: translateY(-1px);
  box-shadow: var(--shadow);
}
.pal svg {
  color: var(--ink-3);
}
.pal-card svg {
  color: var(--ok);
}
.pal-text svg {
  color: var(--info);
}
.pal-image svg {
  color: var(--violet);
}
.pal-sticker svg {
  color: var(--warn);
}
.list-tools {
  display: flex;
  gap: 8px;
  margin: 8px 0 10px;
}
.searchbox {
  flex: 1;
  min-width: 0;
  position: relative;
}
.searchbox svg {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--ink-3);
}
.searchbox input {
  width: 100%;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 8px 10px 8px 32px;
  min-width: 0;
}
.searchbox input:focus {
  outline: none;
  border-color: var(--accent);
}
.rules {
  list-style: none;
  margin: 0;
  padding: 0 0 6px;
  flex: 1;
  min-height: 0;
  overflow: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  scrollbar-width: thin;
}
.rules.drop-end {
  box-shadow: inset 0 -3px 0 var(--accent);
}
.rules-empty {
  color: var(--ink-3);
  text-align: center;
  padding: 24px 10px;
  border: 1px dashed var(--line-2);
  border-radius: 12px;
}
.rule {
  display: flex;
  gap: 6px;
  align-items: flex-start;
  padding: 10px 8px 10px 4px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--panel);
  cursor: pointer;
  position: relative;
}
.rule:hover {
  border-color: var(--line-2);
}
.rule.sel {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: 0 0 0 1px var(--accent) inset;
}
.rule.off .rule-title,
.rule.off .rule-kw {
  opacity: 0.55;
}
.rule.dragging {
  opacity: 0.4;
}
.rule.drop-before::before,
.rule.drop-after::after {
  content: '';
  position: absolute;
  left: 6px;
  right: 6px;
  height: 3px;
  border-radius: 3px;
  background: var(--accent);
}
.rule.drop-before::before {
  top: -6px;
}
.rule.drop-after::after {
  bottom: -6px;
}
.grip {
  color: var(--ink-3);
  cursor: grab;
  padding-top: 2px;
  flex: none;
}
.rule-main {
  flex: 1;
  min-width: 0;
}
.rule-title {
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.rule-title b {
  color: var(--ink-3);
  font-weight: 600;
}
.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin: 5px 0 4px;
}
.tag {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.3px;
  padding: 1px 7px;
  border-radius: 6px;
  background: var(--panel-2);
  color: var(--ink-2);
  border: 1px solid var(--line);
}
.t-card {
  background: var(--ok-soft);
  color: var(--ok);
  border-color: transparent;
}
.t-text {
  background: var(--info-soft);
  color: var(--info);
  border-color: transparent;
}
.t-image {
  background: var(--violet-soft);
  color: var(--violet);
  border-color: transparent;
}
.t-sticker {
  background: var(--warn-soft);
  color: var(--warn);
  border-color: transparent;
}
.t-flex {
  background: var(--ok-soft);
  color: var(--ok);
  border-color: transparent;
}
.t-silent {
  background: var(--panel-2);
  color: var(--ink-2);
}
.t-quick {
  background: var(--orange-soft);
  color: var(--orange);
  border-color: transparent;
}
.t-warn {
  background: var(--warn-soft);
  color: var(--warn);
  border-color: transparent;
}
.t-off {
  margin-left: 6px;
  background: var(--panel-2);
}
.rule-kw {
  display: flex;
  align-items: center;
  gap: 5px;
  color: var(--ink-2);
  font-size: 12px;
  min-width: 0;
}
.rule-kw svg {
  color: var(--warn);
}
.rule-kw span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.rule-act {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  flex: none;
}
.rule-act .switch {
  margin-bottom: 4px;
}
.col-foot {
  margin-top: 6px;
  padding: 8px 4px 0;
  font-size: 12px;
  color: var(--ink-3);
  border-top: 1px solid var(--line);
}

/* ---- centre ---- */
#center,
#sim {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
}
.testbar {
  padding: 12px 16px 10px;
  border-bottom: 1px solid var(--line);
  background: var(--panel-2);
}
.testrow {
  display: flex;
  gap: 9px;
  align-items: center;
}
.testrow label {
  font-weight: 600;
  white-space: nowrap;
  color: var(--ink-2);
  font-size: 13px;
}
.test-result {
  margin-top: 8px;
  font-size: 12.5px;
  min-height: 20px;
}
.matched {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--ok-soft);
  color: var(--ok);
  padding: 3px 10px;
  border-radius: 999px;
  font-weight: 500;
}
.matched.none {
  background: var(--panel);
  color: var(--ink-2);
  border: 1px solid var(--line-2);
}
.center-body {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 16px 18px 28px;
  scrollbar-width: thin;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.ed-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  flex-wrap: wrap;
}
.ed-head h2 {
  font-size: 18px;
}
.ed-act {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
}
.sec-title {
  font-size: 14px;
  font-weight: 700;
}
.sec-title small {
  color: var(--ink-3);
  font-weight: 500;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}
.f-label {
  font-weight: 600;
  font-size: 13px;
}
.f-hint {
  color: var(--ink-3);
  font-size: 12px;
}
.f-hint.ok {
  color: var(--ok);
}
.f-hint.bad {
  color: var(--bad);
}
.name-row {
  display: flex;
  gap: 14px;
  align-items: center;
}
.stack {
  display: flex;
  flex-direction: column;
  gap: 9px;
  align-items: flex-start;
}
.stack > .chips-in,
.stack > textarea {
  align-self: stretch;
}
.two {
  display: grid;
  grid-template-columns: 1fr 1.6fr;
  gap: 8px;
}
.chips-in {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 6px 8px;
  min-height: 42px;
  background: var(--panel);
  border: 1px solid var(--line-2);
  border-radius: 9px;
  align-items: center;
  cursor: text;
  width: 100%;
}
.chips-in:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
}
.kchip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--accent-soft);
  color: var(--ok);
  border: 1px solid var(--accent-line);
  border-radius: 999px;
  padding: 2px 4px 2px 10px;
  font-size: 13px;
  max-width: 100%;
}
.kchip.static {
  padding-right: 10px;
}
.kchip button {
  border: 0;
  background: transparent;
  display: grid;
  place-items: center;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  color: inherit;
  padding: 0;
}
.kchip button:hover {
  background: color-mix(in srgb, var(--ok) 20%, transparent);
}
.chips-field {
  flex: 1;
  min-width: 140px;
  border: 0;
  outline: 0;
  background: transparent;
  padding: 4px 2px;
}
.replies {
  display: flex;
  flex-direction: column;
  gap: 10px;
  border-radius: 12px;
}
.replies.drop-here {
  outline: 2px dashed var(--accent);
  outline-offset: 4px;
}
.rblock {
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--panel);
}
.rb-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 8px 8px 12px;
  border-bottom: 1px solid var(--line);
  background: var(--panel-2);
  border-radius: 12px 12px 0 0;
}
.rb-act {
  margin-left: auto;
  display: flex;
  gap: 2px;
}
.rb-body {
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.pics {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.pic {
  width: 66px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 6px 4px 4px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  font-size: 11px;
  color: var(--ink-2);
}
.pic img {
  width: 40px;
  height: 40px;
  object-fit: contain;
}
.pic-none {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  color: var(--ink-3);
  font-size: 18px;
}
.pic.on {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--ok);
}
.adders {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  color: var(--ink-2);
}
.problems {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 10px 12px;
  border-radius: 10px;
  background: var(--warn-soft);
  color: var(--warn);
}
.problems ul {
  margin: 4px 0 0;
  padding-left: 18px;
}
.empty-state {
  margin: auto;
  max-width: 420px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  color: var(--ink-2);
  padding: 30px 10px;
}
.empty-state svg {
  color: var(--ink-3);
}
.empty-state h3 {
  color: var(--ink);
  font-size: 16px;
}
.card-sec {
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: var(--panel);
}
.toolbar {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.toolbar .input {
  flex: 1;
  min-width: 180px;
}
.schools {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.school {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) 34px;
  gap: 8px 10px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 12px;
  align-items: start;
}
.school.bad {
  border-color: var(--warn);
}
.school-main {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.school-alias .chips-in {
  min-height: 38px;
}
.hitbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-radius: 10px;
  background: var(--ok-soft);
  color: var(--ok);
  font-weight: 500;
}
.statusline {
  display: flex;
  align-items: center;
  gap: 10px;
}
.modes {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.mode {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  text-align: left;
  padding: 11px 12px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--panel);
}
.mode small {
  display: block;
  color: var(--ink-2);
  margin-top: 2px;
}
.mode .radio {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 2px solid var(--line-2);
  margin-top: 2px;
  flex: none;
}
.mode.on {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.mode.on .radio {
  border-color: var(--accent);
  background: radial-gradient(var(--accent) 45%, transparent 50%);
}
.confirm {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 10px 12px;
  border-radius: 10px;
  background: var(--warn-soft);
  color: var(--warn);
}
.confirm div {
  display: flex;
  gap: 8px;
}
.people {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.kv {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 9px 14px;
  margin: 0;
}
.kv dt {
  color: var(--ink-2);
}
.kv dd {
  margin: 0;
  text-align: right;
}

/* ---- the answer-order map ---- */
.flow {
  display: flex;
  flex-direction: column;
  align-items: stretch;
}
.flow-start {
  display: flex;
  align-items: center;
  gap: 8px;
  align-self: flex-start;
  padding: 8px 14px 8px 12px;
  border-radius: 999px;
  background: var(--panel);
  border: 1px solid var(--line-2);
  box-shadow: var(--shadow);
}
.flow-start small {
  display: block;
  color: var(--ink-3);
}
.flow-start .live-dot {
  margin: 0;
}
.nomatch {
  margin: 0 0 0 26px;
  padding: 3px 0 3px 10px;
  border-left: 2px dashed var(--line-2);
  color: var(--ink-3);
  font-size: 11.5px;
  min-height: 18px;
}
.nomatch.stop {
  border-left-color: var(--accent);
  min-height: 8px;
}
.flow-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 62px minmax(0, 0.8fr);
  align-items: center;
  gap: 0;
}
.stage {
  text-align: left;
  border: 1px solid var(--line-2);
  background: var(--panel);
  border-radius: 12px;
  padding: 9px 12px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
  box-shadow: var(--shadow);
}
.stage.sys {
  background: var(--panel-2);
  border-style: dashed;
  box-shadow: none;
}
.stage.sel {
  border-color: var(--accent);
}
.stage:hover {
  border-color: var(--accent-line);
}
.stage-name {
  font-weight: 600;
}
.stage-when {
  color: var(--ink-2);
  font-size: 12px;
}
.arrow {
  display: flex;
  flex-direction: column;
  align-items: center;
  color: var(--accent);
  font-size: 10.5px;
  font-weight: 700;
}
.arrow i {
  display: block;
  width: 100%;
  height: 2px;
  background: var(--accent);
  position: relative;
}
.arrow i::after {
  content: '';
  position: absolute;
  right: -1px;
  top: -4px;
  border: 5px solid transparent;
  border-left: 7px solid var(--accent);
}
.out {
  padding: 9px 12px;
  border-radius: 12px;
  background: var(--accent-soft);
  border: 1px solid var(--accent-line);
  color: var(--ok);
  font-size: 12.5px;
  min-width: 0;
  overflow-wrap: anywhere;
}
.out.silent {
  background: var(--panel-2);
  color: var(--ink-2);
  border-color: var(--line-2);
}
.flow-row.hit .stage {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent);
}
.flow-row.hit .out {
  background: var(--accent);
  color: var(--accent-ink);
}
.flow-row.skipped {
  opacity: 0.45;
}

/* ---- the phone ---- */
.sim-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 12px 14px 6px;
}
.sim-title {
  font-weight: 700;
  font-size: 13px;
  display: inline-flex;
  align-items: center;
}
.try {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  padding: 4px 14px 10px;
  color: var(--ink-2);
  font-size: 12px;
  max-height: 96px;
  overflow: auto;
}
.chip {
  border: 1px solid var(--line-2);
  background: var(--panel);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 12px;
  color: var(--ink);
}
.chip:hover {
  border-color: var(--accent);
  color: var(--ok);
}
.phone {
  flex: 1;
  min-height: 0;
  margin: 0 14px 14px;
  border-radius: 20px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: var(--chat-bg);
  border: 1px solid var(--line-2);
}
.phone-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px 9px 14px;
  background: #1f2a3a;
  color: #fff;
}
.phone-back {
  font-size: 22px;
  line-height: 1;
  opacity: 0.8;
}
.phone-name {
  flex: 1;
  display: flex;
  flex-direction: column;
  line-height: 1.2;
  min-width: 0;
}
.phone-name b {
  font-size: 14px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.phone-name small {
  font-size: 11px;
  color: #7be0a4;
}
.chat {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 12px 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  scrollbar-width: thin;
}
.chat-empty {
  margin: auto;
  text-align: center;
  color: rgba(255, 255, 255, 0.85);
  max-width: 250px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.row {
  display: flex;
  gap: 7px;
  align-items: flex-start;
}
.row.user {
  justify-content: flex-end;
}
.bubble {
  max-width: 78%;
  padding: 8px 12px;
  border-radius: 18px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  box-shadow: 0 1px 1px rgba(0, 0, 0, 0.12);
  color: #111;
}
.bubble.me {
  background: var(--bubble-me);
  border-top-right-radius: 5px;
}
.bubble.bot {
  background: var(--bubble-bot);
  border-top-left-radius: 5px;
}
:root[data-theme='dark'] .bubble.bot,
:root[data-theme='dark'] .bubble.me {
  color: #f2f5f7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) .bubble.bot,
  :root:not([data-theme='light']) .bubble.me {
    color: #f2f5f7;
  }
}
.avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--accent-ink);
  display: grid;
  place-items: center;
  flex: none;
  margin-top: 2px;
}
.bot-col {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
  align-items: flex-start;
  max-width: calc(100% - 38px);
}
.flexwrap {
  max-width: 100%;
}
.silent-note {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.82);
  color: #2b3846;
}
.silent-note.small {
  background: rgba(255, 255, 255, 0.6);
}
.media-ph {
  width: 200px;
  height: 120px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.85);
  color: #3a4756;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  text-align: center;
  padding: 8px;
}
.media-ph small {
  font-size: 11px;
  max-width: 180px;
  overflow-wrap: anywhere;
}
.media-sticker {
  width: 120px;
  height: 120px;
  background: transparent;
  border: 2px dashed rgba(255, 255, 255, 0.7);
  color: #fff;
}
.quick {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 2px;
}
.qchip {
  border: 1px solid #b9c5d6;
  background: #fff;
  color: #1a2533;
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 13px;
  max-width: 100%;
}
.qchip:hover {
  background: #eef6ff;
}
.phone-input {
  display: flex;
  gap: 8px;
  padding: 8px 10px;
  background: var(--panel);
  border-top: 1px solid var(--line);
}
.chat-input {
  flex: 1;
  min-width: 0;
  border: 1px solid var(--line-2);
  background: var(--panel-2);
  border-radius: 999px;
  padding: 8px 14px;
}
.chat-input:focus {
  outline: none;
  border-color: var(--accent);
}
.send {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 0;
  background: var(--accent);
  color: var(--accent-ink);
  display: grid;
  place-items: center;
  flex: none;
}
.json-pane {
  flex: 1;
  min-height: 0;
  margin: 0 14px 14px;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
}
.json-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 12px;
  background: var(--panel-2);
  border-bottom: 1px solid var(--line);
  font-size: 12.5px;
  color: var(--ink-2);
}
.code {
  flex: 1;
  min-height: 0;
  margin: 0;
  overflow: auto;
  padding: 12px;
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.5;
  white-space: pre;
  background: var(--panel);
  color: var(--ink);
}

/* ---- a Flex Message, drawn the LINE way ---- */
.fx-bubble {
  background: #fff;
  border-radius: 17px;
  overflow: hidden;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.22);
  display: flex;
  flex-direction: column;
  max-width: 100%;
  flex: none;
  color: #111;
  font-family: var(--font);
}
.fx-section {
  display: flex;
  position: relative;
  box-sizing: border-box;
  min-width: 0;
}
.fx-header,
.fx-body,
.fx-footer {
  padding: 13px;
}
.fx-box {
  display: flex;
  position: relative;
  box-sizing: border-box;
  min-width: 0;
}
.fx-vertical {
  flex-direction: column;
}
.fx-horizontal {
  flex-direction: row;
}
.fx-baseline {
  flex-direction: row;
  align-items: baseline;
}
.fx-text {
  line-height: 1.38;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: #111;
}
.fx-nowrap {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.fx-img {
  display: block;
  max-width: 100%;
}
.fx-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  padding: 6px 10px;
  border-radius: 9px;
  font-weight: 600;
  font-size: 14px;
  text-align: center;
  cursor: pointer;
  user-select: none;
  overflow-wrap: anywhere;
}
.fx-btn-primary {
  background: #06c755;
  color: #fff;
}
.fx-btn-secondary {
  background: #efefef;
  color: #111;
}
.fx-btn-link {
  color: #0b6efd;
  background: transparent;
}
.fx-btn:hover {
  filter: brightness(0.96);
}
.fx-sep {
  border-top: 1px solid #e5e5e5;
  align-self: stretch;
}
.fx-filler {
  flex: 1;
}
.fx-carousel {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  max-width: 100%;
  padding-bottom: 6px;
  scrollbar-width: thin;
}
.fx-missing {
  background: rgba(120, 130, 140, 0.18);
  color: #566371;
  border-radius: 8px;
  display: grid;
  place-items: center;
  font-size: 11px;
  text-align: center;
  padding: 4px;
}

/* ---- popups ---- */
#toasts {
  position: fixed;
  left: 50%;
  bottom: max(18px, env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 60;
  align-items: center;
  pointer-events: none;
}
.toast {
  background: #1b2530;
  color: #fff;
  padding: 9px 16px;
  border-radius: 12px;
  font-size: 13.5px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
  max-width: min(92vw, 520px);
  transition: opacity 0.4s, transform 0.4s;
}
.toast-ok {
  background: #0d8a45;
}
.toast-warn {
  background: #8b5a00;
}
.toast-bad {
  background: #b3261e;
}
.toast.out {
  opacity: 0;
  transform: translateY(6px);
}
.modal-back {
  position: fixed;
  inset: 0;
  background: rgba(8, 14, 20, 0.5);
  display: grid;
  place-items: center;
  z-index: 50;
  padding: 16px;
}
.modal {
  width: min(520px, 100%);
  max-height: 82vh;
  overflow: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.hist {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.hist li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
}
.hist li small {
  display: block;
  color: var(--ink-3);
}
.hist .empty {
  color: var(--ink-3);
  justify-content: center;
}

/* ---- narrower screens ---- */
.bottomnav {
  display: none;
}
@media (max-width: 1180px) {
  .grid {
    grid-template-columns: 300px minmax(0, 1fr) 340px;
  }
  .fx-bubble {
    zoom: 0.92;
  }
}
@media (max-width: 960px) {
  .grid {
    grid-template-columns: minmax(0, 1fr);
    padding-block: 6px 8px;
  }
  .col {
    display: none;
  }
  #app[data-pane='rules'] .col-rules,
  #app[data-pane='center'] .col-center,
  #app[data-pane='sim'] .col-sim {
    display: flex;
  }
  .bottomnav {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    padding: 6px 0 max(8px, env(safe-area-inset-bottom, 0px));
  }
  .bottomnav button {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 7px 4px;
    border-radius: 11px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink-2);
    font-size: 12px;
  }
  .bottomnav button.on {
    background: var(--accent-soft);
    color: var(--ok);
    border-color: var(--accent-line);
    font-weight: 600;
  }
  .brand-t small {
    display: none;
  }
  .actions {
    margin-left: 0;
    width: 100%;
    justify-content: flex-end;
  }
  .actions .lbl {
    display: none;
  }
  .two {
    grid-template-columns: 1fr;
  }
  .school {
    grid-template-columns: minmax(0, 1fr) 34px;
  }
  .school-alias {
    grid-column: 1 / -1;
    order: 3;
  }
  .flow-row {
    grid-template-columns: minmax(0, 1fr) 40px minmax(0, 0.9fr);

  const w = fxLen(n.width);
  const hgt = fxLen(n.height);
  if (w && n.type !== 'image') el.style.width = w;
  if (hgt) el.style.height = hgt;
  if (fxLen(n.maxWidth)) el.style.maxWidth = fxLen(n.maxWidth);
  if (fxLen(n.maxHeight)) el.style.maxHeight = fxLen(n.maxHeight);
  if (n.position === 'absolute') {
    el.style.position = 'absolute';
    for (const [prop, css] of [['offsetTop', 'top'], ['offsetBottom', 'bottom'], ['offsetStart', 'left'], ['offsetEnd', 'right']]) {
      const v = fxLen(n[prop], FX.space);
      if (v) el.style[css] = v;
    }
  } else if (n.type !== 'spacer' && n.type !== 'filler' && n.type !== 'separator') {
    const f = n.flex != null ? Number(n.flex) : parentLayout === 'vertical' ? 0 : 1;
    el.style.flex = f > 0 && !(w && parentLayout !== 'vertical') ? `${f} 1 ${parentLayout === 'vertical' ? 'auto' : '0%'}` : '0 0 auto';
    if (n.type === 'text' || n.type === 'box') el.style.minWidth = '0';
  }
  // alignment of a child along the cross axis
  if (n.align && n.type === 'image') {
    if (parentLayout === 'vertical') el.style.alignSelf = { start: 'flex-start', center: 'center', end: 'flex-end' }[n.align] || '';
    else el.style.marginLeft = n.align === 'end' ? 'auto' : n.align === 'center' ? 'auto' : '';
  }
  if (n.gravity) {
    const g = { top: 'flex-start', center: 'center', bottom: 'flex-end' }[n.gravity];
    if (g && parentLayout !== 'vertical') el.style.alignSelf = g;
  }
  return el;
}

// → the element for one Flex Message (bubble or carousel). ctx.onAction(action) hears the buttons.
function renderFlex(msg, ctx = {}) {
  const c = msg?.contents;
  const bubble = (b) => {
    const el = h('div', { class: 'fx-bubble' });
    el.style.width = `${FX.bubble[b.size] ?? 300}px`;
    for (const part of ['header', 'hero', 'body', 'footer']) {
      if (!b[part]) continue;
      const sec = fxNode(b[part], 'vertical', ctx);
      if (sec.nodeType !== 1) continue;
      sec.classList.add('fx-section', `fx-${part}`);
      const bg = b.styles?.[part]?.backgroundColor;
      if (bg) sec.style.background = bg;
      sec.style.flex = 'none';
      el.append(sec);
    }
    if (b.styles?.body?.backgroundColor && !b.body) el.style.background = b.styles.body.backgroundColor;
    return el;
  };
  if (c?.type === 'carousel') return h('div', { class: 'fx-carousel' }, (c.contents || []).map(bubble));
  if (c?.type === 'bubble') return bubble(c);
  return h('div', { class: 'fx-missing' }, 'Flex ที่แสดงไม่ได้');
}

function textOf(res) {
  const p = res?.payload;
  if (typeof p === 'string') {
    try {
      const j = JSON.parse(p);
      if (typeof j?.result === 'string') return j.result;
    } catch {
      /* plain text */
    }
    return p;
  }
  if (p && typeof p.result === 'string') return p.result;
  return (res?.content || []).map((c) => c.text || '').join('');
}

// The connector wraps rows as  "…the below <untrusted-data-ID> boundaries.\n\n<untrusted-data-ID>\n[rows]\n</untrusted-data-ID>\n\n…"
// (the opening tag is also named in its first sentence, so the rows are what sits between the closing tag and the
// opening tag nearest before it)
function rowsOf(res) {
  // some connectors hand the rows over directly
  for (const x of [res?.structuredContent, res?.payload]) {
    if (Array.isArray(x)) return x;
    if (Array.isArray(x?.rows)) return x.rows;
  }
  const text = textOf(res);
  let body = text;
  const close = text.search(/<\/untrusted-data-[^>]*>/);
  if (close >= 0) {
    const open = text.lastIndexOf('<untrusted-data-', close);
    if (open >= 0) body = text.slice(text.indexOf('>', open) + 1, close);
  }
  try {
    return JSON.parse(body.trim());
  } catch {
    throw Object.assign(new Error('อ่านคำตอบจากฐานข้อมูลไม่ได้'), { code: 'unreadable' });
  }
}

async function runSql(query) {
  if (!S.mcp) throw Object.assign(new Error('ยังไม่ได้เชื่อมฐานข้อมูล'), { code: 'offline' });
  return rowsOf(await S.mcp.callTool(SERVER, 'execute_sql', { project_id: PROJECT, query }));
}

function explain(err) {
  const code = err?.code;
  switch (code) {

    case 'server_not_found':
      return 'ยังไม่ได้เชื่อม Supabase ใน Claude (Settings → Connectors) เชื่อมแล้วโหลดหน้านี้ใหม่ค่ะ';

      return 'การเชื่อม Supabase หมดอายุ ต้องเชื่อมใหม่ใน Claude (Settings → Connectors) ค่ะ';
    case 'selection_required':
      return 'มี Supabase หลายบัญชี เลือกบัญชีของร้านให้หน้านี้ก่อนค่ะ';
    case 'approval_required':
    case 'not_in_manifest':
    case 'consent_required':
    case 'not_granted':
      return 'ต้องกด "อนุญาต" ให้หน้านี้ใช้ Supabase ก่อนค่ะ (กดบันทึกหรือโหลดใหม่อีกครั้งแล้วเลือกอนุญาต)';
    case 'blocked_by_policy':

    case 'tool_error':
      return 'ฐานข้อมูลปฏิเสธ: ' + clip(String(err.message || '').replace(/\s+/g, ' '), 180);

  }
}

function useData(d) {
  S.row = d.faq_bot || { mode: 'off', admins: [], content: {} };

  S.content = contentFrom(S.row, S.bot);
  S.savedJson = JSON.stringify(S.content);
  if (!ruleById(S.sel)) S.sel = S.content.rules[0]?.id ?? null;
}

async function loadAll() {
  try {
    const rows = await runSql('select public.studio_load() as d');
    const d = rows[0]?.d;
    if (!d || !d.faq_bot) throw Object.assign(new Error('ไม่พบตั้งค่าบอทในฐานข้อมูล'), { code: 'nodata' });
    useData(d);
    S.conn = 'ready';
    S.connMsg = '';
  } catch (e) {
    S.conn = 'error';
    S.connMsg = explain(e);
    if (!S.content) loadDemo();
  }
}

  S.conn = 'connecting';
  try {

// What the bot would do with one message. pure = look only, change nothing (used to refresh an earlier turn after an edit).
function simulate(text, { pure = false } = {}) {
  const shop = currentShop();
  const r = Engine.buildReply(text, shop, { awaitingSchool: S.awaiting });
  if (!pure) S.awaiting = Boolean(r.awaitingSchool);
  let messages = r.messages;
  let note = '';
  if (r.needsPhotos) {
    messages = shop.contact.people.length ? [Engine.contactCard(shop, r.askText ?? shop.contact.ask, {})] : [];
  } else if (r.greeting && !shop.engineGreeting && !r.menuRequest) {
    messages = [];
    note = 'แค่ทักทาย: บอทนี้ไม่ตอบ (การ์ดเมนูของระบบร้านทักให้อยู่แล้ว)';
  } else if (r.silent) {
    note = r.matched ? 'กฎนี้ตั้งไว้ "ไม่ตอบ": แอดมินตอบเอง' : 'บอทไม่รู้จักเรื่องนี้: ไม่ตอบ แอดมินเห็นแชทแล้วตอบเอง';
  }
  const holiday = !pure && !S.holidayShown && !/ขอบคุณ/.test(text) ? Engine.holidayNotice(shop, new Date()) : null;
  if (holiday && messages.length) {
    messages = [holiday.message, ...messages].slice(0, 5);
    S.holidayShown = true;
  }
  const out = Engine.withSender(messages, '', r.quick === false ? undefined : Engine.quick(shop));
  return { stage: r.stage || 'fallback', matched: r.matched ?? null, which: r.which ?? null, msgs: out, note, silent: Boolean(r.silent) || !out.length };
}

function sendUser(text) {
  const t = String(text ?? '').trim();
  if (!t) return;
  const turn = { id: uid(), text: t, ...simulate(t) };
  S.chat.push(turn);
  if (S.chat.length > 40) S.chat.shift();
  S.lastRun = { text: t, stage: turn.stage, matched: turn.matched, which: turn.which };
  renderSim();
  if (S.view === 'flow') renderCenter();
  else renderTestLine();
}

// after an edit: the earlier answers that came from the rule being edited are redrawn with the new wording
const refreshTurns = debounce(() => {
  let changed = false;
  for (const t of S.chat) {
    if (t.matched && t.matched === S.sel) {
      Object.assign(t, simulate(t.text, { pure: true }));
      changed = true;
    }
  }
  if (changed) renderSim();
}, 250);

function resetChat() {
  S.chat = [];
  S.awaiting = false;
  S.lastRun = null;
  S.holidayShown = false;
  renderSim();
  renderTestLine();
  if (S.view === 'flow') renderCenter();
}

// a few messages worth trying: the usual questions, then the first keyword of the owner's own rules
function sampleMessages() {
  const base = ['เวลาเปิดร้าน', 'สั่งของ', 'อุปกรณ์การเรียน 2-69', 'ที่ตั้งร้าน', 'ขอบคุณค่ะ', 'คุยกับแอดมิน', 'สั่งทำป้ายไวนิล', 'เมนู'];
  const seen = new Set(base);
  const extra = [];
  for (const r of S.content?.rules || []) {
    const k = r.keywords?.[0];
    if (r.enabled !== false && k && !seen.has(k)) {
      seen.add(k);
      extra.push(k);
    }
    if (extra.length >= 5) break;
  }
  return [...base, ...extra];
}

function copyText(text) {
  const done = () => toast('คัดลอกแล้ว');
  const fallback = () => {
    const ta = h('textarea', { style: { position: 'fixed', opacity: '0' } });
    ta.value = text;
    document.body.append(ta);
    ta.select();
    try {
      document.execCommand('copy');
      done();
    } catch {
      toast('คัดลอกไม่ได้ เลือกข้อความแล้วกด Ctrl+C ค่ะ', 'warn');
    }
    ta.remove();
  };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
}

const PALETTE = ['text', 'card', 'image', 'sticker', 'silent'];

function newReply(type) {
  switch (type) {
    case 'text':
      return { type: 'text', text: '' };
    case 'card':
      return { type: 'card', title: '', text: '', image: '', button: null };
    case 'image':
      return { type: 'image', url: '', previewUrl: '' };
    case 'sticker':
      return { type: 'sticker', packageId: '446', stickerId: '1988' };
    case 'flex':
      return {
        type: 'flex',
        altText: 'ข้อความจากร้าน',
        contents: { type: 'bubble', body: { type: 'box', layout: 'vertical', contents: [{ type: 'text', text: 'สวัสดีค่ะ', weight: 'bold', size: 'lg', wrap: true }] } },
      };
    default:
      return { type: 'silent' };
  }
}

function newRule(type) {
  return { id: uid(), name: 'กฎใหม่', enabled: true, match: 'contains', keywords: [], replies: [newReply(type)], quick: true };
}

// what is missing before a rule can answer
function problemsOf(rule) {
  const p = [];
  if (!rule.keywords?.length) p.push('ยังไม่มีคำที่ลูกค้าพิมพ์');
  const rs = rule.replies || [];
  if (!rs.length) p.push('ยังไม่มีคำตอบ');
  rs.forEach((r, i) => {
    const n = rs.length > 1 ? ` (คำตอบที่ ${i + 1})` : '';
    if (r.type === 'text' && !String(r.text || '').trim()) p.push('ข้อความว่าง' + n);
    if (r.type === 'card' && !String(r.text || '').trim()) p.push('การ์ดยังไม่มีข้อความ' + n);
    if (r.type === 'card' && r.button && String(r.button.url || '').trim() && !/^https:\/\//i.test(r.button.url)) p.push('ลิงก์ปุ่มต้องขึ้นต้น https://' + n);
    if (r.type === 'image' && !/^https:\/\//i.test(String(r.url || ''))) p.push('รูปต้องเป็นลิงก์ https://' + n);
    if (r.type === 'sticker' && !(/^\d+$/.test(String(r.packageId || '')) && /^\d+$/.test(String(r.stickerId || '')))) p.push('เลขสติกเกอร์ไม่ถูกต้อง' + n);
    if (r.type === 'flex' && !(r.contents && ['bubble', 'carousel'].includes(r.contents.type))) p.push('JSON ของ Flex ไม่ถูกต้อง' + n);
  });
  return p;
}

const typesOf = (rule) => [...new Set((rule.replies || []).map((r) => r.type))];

function ruleItem(rule, index) {
  const probs = problemsOf(rule);
  const li = h('li', { class: 'rule' + (rule.id === S.sel ? ' sel' : '') + (rule.enabled === false ? ' off' : ''), draggable: 'true', dataset: { id: rule.id }, tabindex: '0' });
  const tags = h('div', { class: 'tags' });
  for (const t of typesOf(rule)) tags.append(h('span', { class: 'tag t-' + t }, TYPE_INFO[t]?.tag || t));
  tags.append(h('span', { class: 'tag t-match' }, rule.match === 'exact' ? 'ตรงทั้งข้อความ' : 'มีคำนี้'));
  if (rule.quick !== false && typesOf(rule)[0] !== 'silent') tags.append(h('span', { class: 't-quick tag' }, 'ปุ่มลัด'));
  if (probs.length) tags.append(h('span', { class: 'tag t-warn', title: probs.join(' · ') }, 'ยังไม่ครบ'));
  const kw = (rule.keywords || []).join(', ');
  li.append(
    h('span', { class: 'grip', title: 'ลากเพื่อสลับลำดับ' }, icon('grip', 16)),
    h(
      'div',
      { class: 'rule-main' },
      h('div', { class: 'rule-title' }, h('b', {}, `${index + 1}. `), rule.name || '(ไม่มีชื่อ)'),
      tags,
      h('div', { class: 'rule-kw' }, icon('key', 13), h('span', {}, kw ? clip(kw, 70) : 'ยังไม่มีคำ'))
    ),
    h(
      'div',
      { class: 'rule-act' },
      h('label', { class: 'switch', title: rule.enabled === false ? 'ปิดอยู่ (บอทข้ามกฎนี้)' : 'เปิดใช้' }, h('input', { type: 'checkbox', checked: rule.enabled !== false, 'aria-label': 'เปิดใช้กฎนี้', onchange: (e) => ((rule.enabled = e.target.checked), touch()) }), h('i')),
      h('button', { type: 'button', class: 'iconbtn', title: 'ทำสำเนา', onclick: (e) => (e.stopPropagation(), duplicateRule(rule.id)) }, icon('copy', 15)),
      h('button', { type: 'button', class: 'iconbtn danger', title: 'ลบกฎนี้', onclick: (e) => (e.stopPropagation(), deleteRule(rule.id)) }, icon('trash', 15))
    )
  );
  li.addEventListener('click', (e) => {
    if (e.target.closest('.rule-act')) return;
    selectRule(rule.id);
  });
  li.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target === li) {
      e.preventDefault();
      selectRule(rule.id);
    }
  });
  return li;
}

function renderPalette() {
  const box = $('#palette');
  if (!box) return;
  box.replaceChildren(
    ...PALETTE.map((t) => {
      const info = TYPE_INFO[t];
      const b = h('button', { type: 'button', class: 'pal pal-' + t, draggable: 'true', title: info.hint + ' — ลากไปวาง หรือกดเพื่อสร้างกฎใหม่' }, icon(info.icon, 20), h('span', {}, info.name));
      b.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/x-new-reply', t);
        e.dataTransfer.effectAllowed = 'copy';
      });
      b.addEventListener('click', () => addRule(t));
      return b;
    })
  );
}

function renderRules() {
  const ul = $('#rules');
  if (!ul) return;
  const rules = S.content?.rules || [];
  const q = S.q.trim().toLowerCase();
  const shown = rules.map((r, i) => ({ r, i })).filter(({ r }) => !q || (r.name || '').toLowerCase().includes(q) || (r.keywords || []).some((k) => k.toLowerCase().includes(q)));
  ul.replaceChildren(...shown.map(({ r, i }) => ruleItem(r, i)));
  if (!shown.length) ul.append(h('li', { class: 'rules-empty' }, rules.length ? 'ไม่พบกฎที่ค้นหา' : 'ยังไม่มีกฎ กด “เพิ่มกฎใหม่” หรือลากชนิดคำตอบมาวางที่นี่'));
  const cnt = $('#rules-count');
  if (cnt) cnt.textContent = String(rules.length);
}

// ---- changing the list ------------------------------------------------------------------------------------------

function touch() {
  updateHeader();
  renderRules();
  refreshTurns();
}

function selectRule(id) {
  S.sel = id;
  if (S.view !== 'editor' && S.view !== 'flow') S.view = 'editor';
  S.pane = 'center';
  renderRules();
  renderCenter();
  renderPane();
}

function addRule(type, at) {
  const r = newRule(type);
  const list = S.content.rules;
  if (list.length >= Engine.MAX_RULES) return toast(`ใส่ได้ไม่เกิน ${Engine.MAX_RULES} กฎค่ะ`, 'warn');
  if (at == null || at > list.length) list.push(r);
  else list.splice(at, 0, r);
  S.sel = r.id;
  S.view = 'editor';
  S.pane = 'center';
  S.q = '';
  const qi = $('#rule-q');
  if (qi) qi.value = '';
  touch();
  renderCenter();
  renderPane();
  setTimeout(() => $('#f-name')?.select(), 0);
}

function duplicateRule(id) {
  const i = S.content.rules.findIndex((r) => r.id === id);
  if (i < 0) return;
  const copy = clone(S.content.rules[i]);
  copy.id = uid();
  copy.name = (copy.name || 'กฎ') + ' (สำเนา)';
  S.content.rules.splice(i + 1, 0, copy);
  S.sel = copy.id;
  touch();
  renderCenter();
}

function deleteRule(id) {
  const i = S.content.rules.findIndex((r) => r.id === id);
  if (i < 0) return;
  const [gone] = S.content.rules.splice(i, 1);
  if (S.sel === id) S.sel = S.content.rules[Math.min(i, S.content.rules.length - 1)]?.id ?? null;
  touch();
  renderCenter();
  toast(`ลบ “${clip(gone.name || 'กฎ', 24)}” แล้ว (ยังไม่บันทึกจนกว่าจะกดบันทึก)`, 'info');
}

function moveRule(id, delta) {
  const list = S.content.rules;
  const i = list.findIndex((r) => r.id === id);
  const j = i + delta;
  if (i < 0 || j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  touch();
  renderCenter();
}

// ---- drag and drop --------------------------------------------------------------------------------------------

function wireRulesDnD() {
  const ul = $('#rules');
  if (!ul) return;
  let overEl = null;
  let overAfter = false;
  const clear = () => {
    $$('.drop-before,.drop-after', ul).forEach((e) => e.classList.remove('drop-before', 'drop-after'));
    ul.classList.remove('drop-end');
    overEl = null;
  };
  ul.addEventListener('dragstart', (e) => {
    const li = e.target.closest?.('li.rule');
    if (!li) return;
    e.dataTransfer.setData('text/x-rule', li.dataset.id);
    e.dataTransfer.effectAllowed = 'move';
    li.classList.add('dragging');
  });
  ul.addEventListener('dragend', () => {
    $$('.dragging', ul).forEach((e) => e.classList.remove('dragging'));
    clear();
  });
  ul.addEventListener('dragover', (e) => {
    const types = Array.from(e.dataTransfer?.types || []);
    if (!types.includes('text/x-rule') && !types.includes('text/x-new-reply')) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = types.includes('text/x-rule') ? 'move' : 'copy';
    clear();
    const li = e.target.closest('li.rule');
    if (li) {
      const r = li.getBoundingClientRect();
      overAfter = e.clientY > r.top + r.height / 2;
      overEl = li;
      li.classList.add(overAfter ? 'drop-after' : 'drop-before');
    } else {
      ul.classList.add('drop-end');
    }
  });
  ul.addEventListener('dragleave', (e) => {
    if (!ul.contains(e.relatedTarget)) clear();
  });
  ul.addEventListener('drop', (e) => {
    e.preventDefault();
    const rid = e.dataTransfer.getData('text/x-rule');
    const nt = e.dataTransfer.getData('text/x-new-reply');
    const list = S.content.rules;
    let at = list.length;
    if (overEl) {
      const i = list.findIndex((r) => r.id === overEl.dataset.id);
      at = overAfter ? i + 1 : i;
    }
    clear();
    if (rid) {
      const from = list.findIndex((r) => r.id === rid);
      if (from < 0) return;
      const [moved] = list.splice(from, 1);
      if (from < at) at -= 1;
      list.splice(Math.max(0, Math.min(at, list.length)), 0, moved);
      touch();
      renderCenter();
    } else if (nt) {
      addRule(nt, at);
    }
  });
}

function field(label, control, hint, cls) {
  return h('div', { class: 'field' + (cls ? ' ' + cls : '') }, h('label', { class: 'f-label' }, label), control, hint ? h('p', { class: 'f-hint' }, hint) : null);

function textInput(value, onInput, attrs = {}) {
  const el = h('input', { type: 'text', class: 'input', autocomplete: 'off', ...attrs });
  el.value = value ?? '';
  el.addEventListener('input', () => onInput(el.value));
  return el;
}

function textArea(value, onInput, rows = 4, attrs = {}) {
  const el = h('textarea', { class: 'input area', rows: String(rows), ...attrs });

}

function seg(options, value, onChange) {
  return h('div', { class: 'seg' }, options.map(([v, label, hint]) => h('button', { type: 'button', class: v === value ? 'on' : '', title: hint || '', onclick: () => onChange(v) }, label)));
}

function toggle(checked, label, onChange, id) {

}

// words as little tags: type, press Enter or comma to add
function chipsInput(values, onChange, { placeholder = 'พิมพ์คำแล้วกด Enter', max = 40, maxLen = 60 } = {}) {
  const box = h('div', { class: 'chips-in' });
  const list = values;
  const draw = () => {
    box.replaceChildren();
    list.forEach((v, i) =>
      box.append(
        h(
          'span',
          { class: 'kchip' },
          v,
          h(
            'button',
            {
              type: 'button',
              title: 'เอาออก',
              onclick: () => {
                list.splice(i, 1);
                onChange(list);
                draw();
              },
            },
            icon('x', 12)
          )
        )
      )
    );
    const inp = h('input', { type: 'text', class: 'chips-field', placeholder: list.length ? '' : placeholder, autocomplete: 'off' });
    const add = () => {
      const parts = inp.value.split(/[,\n]/).map((s) => s.trim().slice(0, maxLen)).filter(Boolean);
      if (!parts.length) return;
      let n = 0;
      for (const p of parts) {
        if (list.length >= max) break;
        if (list.some((x) => x.toLowerCase() === p.toLowerCase())) continue;
        list.push(p);
        n++;
      }
      inp.value = '';
      if (n) {
        onChange(list);
        draw();
        box.querySelector('.chips-field')?.focus();
      }
    };
    inp.addEventListener('keydown', (e) => {
      if ((e.key === 'Enter' || e.key === ',') && !e.isComposing) {
        e.preventDefault();
        add();
      } else if (e.key === 'Backspace' && !inp.value && list.length) {
        list.pop();
        onChange(list);
        draw();
        box.querySelector('.chips-field')?.focus();
      }
    });
    inp.addEventListener('blur', add);
    box.append(inp);
  };
  draw();
  box.addEventListener('click', (e) => {
    if (e.target === box) box.querySelector('.chips-field')?.focus();
  });
  return box;
}

const flexRaw = new WeakMap(); // the text of a Flex JSON box while it is being typed

function replyBlock(rule, reply, index) {
  const info = TYPE_INFO[reply.type] || TYPE_INFO.text;
  const total = rule.replies.length;
  const head = h(
    'div',

      total > 1 ? h('button', { type: 'button', class: 'iconbtn', title: 'เลื่อนลง', disabled: index === total - 1, onclick: () => moveReply(rule, index, 1) }, icon('down', 15)) : null,

    )

  switch (reply.type) {

      break;
    case 'card':
      body.append(
        field('หัวเรื่อง', textInput(reply.title, (v) => ((reply.title = v), upd()), { maxlength: '40', placeholder: 'เช่น เวลาเปิดร้าน' })),
        field('ข้อความในการ์ด', textArea(reply.text, (v) => ((reply.text = v), upd()), 5, { maxlength: '2000', placeholder: 'พิมพ์รายละเอียด…' })),
        field('รูปตัวการ์ตูนมุมการ์ด', picturePicker(reply, upd)),
        field(
          'ปุ่มลิงก์ (ไม่ใส่ก็ได้)',
          h(
            'div',
            { class: 'two' },
            textInput(reply.button?.label ?? '', (v) => ((reply.button = { label: v, url: reply.button?.url ?? '' }), upd()), { maxlength: '20', placeholder: 'ชื่อปุ่ม เช่น เปิดแผนที่' }),
            textInput(reply.button?.url ?? '', (v) => ((reply.button = { label: reply.button?.label ?? '', url: v }), upd()), { placeholder: 'https://…' })
          ),
          'ลิงก์ต้องขึ้นต้นด้วย https:// ถ้าไม่ใส่ลิงก์ ปุ่มจะไม่แสดง'
        )
      );
      break;
    case 'image':
      body.append(
        field('ลิงก์รูป (https)', textInput(reply.url, (v) => ((reply.url = v), upd()), { placeholder: 'https://…/รูป.png' }), 'ไฟล์ JPEG หรือ PNG ไม่เกิน 10 MB ในหน้านี้จะเห็นเป็นกรอบ รูปจริงจะแสดงใน LINE'),
        field('รูปตัวอย่างเล็ก (ไม่ใส่ก็ได้)', textInput(reply.previewUrl, (v) => ((reply.previewUrl = v), upd()), { placeholder: 'https://… ไม่เกิน 1 MB' }))
      );
      break;
    case 'sticker':
      body.append(
        field(
          'เลขสติกเกอร์',
          h(
            'div',
            { class: 'two' },
            textInput(reply.packageId, (v) => ((reply.packageId = v.trim()), upd()), { inputmode: 'numeric', placeholder: 'Package ID เช่น 446' }),
            textInput(reply.stickerId, (v) => ((reply.stickerId = v.trim()), upd()), { inputmode: 'numeric', placeholder: 'Sticker ID เช่น 1988' })
          ),
          'ดูเลขได้ที่ developers.line.biz → Messaging API → Sticker list (ใช้ได้เฉพาะชุดที่ LINE อนุญาตให้บอทส่ง)'
        )
      );

    case 'flex': {

      const msg = h('p', { class: 'f-hint' });

        try {
          const j = JSON.parse(flexRaw.get(reply));
          if (!j || !['bubble', 'carousel'].includes(j.type)) throw new Error('ต้องขึ้นต้นด้วย "type": "bubble" หรือ "carousel"');

      const area = textArea(flexRaw.get(reply), (v) => (flexRaw.set(reply, v), check(), upd()), 10, { class: 'input area mono', spellcheck: 'false' });

function moveReply(rule, i, d) {
  const j = i + d;
  if (j < 0 || j >= rule.replies.length) return;
  [rule.replies[i], rule.replies[j]] = [rule.replies[j], rule.replies[i]];
  touch();
  renderCenter();
}

function removeReply(rule, i) {
  rule.replies.splice(i, 1);
  touch();
  renderCenter();
}

function addReply(rule, type) {
  if (type === 'silent') rule.replies = [newReply('silent')];
  else {
    if (rule.replies.some((r) => r.type === 'silent')) rule.replies = [];
    if (rule.replies.length >= Engine.MAX_REPLIES) return toast(`หนึ่งกฎส่งได้ไม่เกิน ${Engine.MAX_REPLIES} ข้อความค่ะ`, 'warn');
    rule.replies.push(newReply(type));
  }
  touch();
  renderCenter();
}

    )
  );

  );

      { class: 'stack' },

          ['exact', 'พิมพ์ตรงทั้งข้อความ', 'ต้องเป็นคำนั้นคำเดียว (คำว่า ค่ะ/ครับ ไม่นับ)'],
        ],
        rule.match === 'exact' ? 'exact' : 'contains',
        (v) => ((rule.match = v), touch(), renderCenter())
      ),
      chipsInput(rule.keywords, () => touch(), { placeholder: 'พิมพ์คำที่ลูกค้าอาจพิมพ์ แล้วกด Enter (เพิ่มได้หลายคำ)' })
    ),

const STAGE_NAMES = {
  thanks: 'ขอบคุณ (ระบบ)',
  school: 'ลูกค้าบอกชื่อโรงเรียน (ระบบ)',
  supplies: 'อุปกรณ์การเรียน → ถามว่าโรงเรียนไหน (ระบบ)',
  contact: 'คุยกับแอดมิน (ระบบ)',
  document: 'ส่งเอกสารโครงการ (ระบบ)',
  order: 'สั่งงาน/สั่งทำ → เลือกแอดมิน (ระบบ)',
  ask: 'ถามเรื่องที่บอทไม่รู้ → เลือกแอดมิน (ระบบ)',
  greeting: 'ทักทาย / เมนู (ระบบ)',
  fallback: 'ไม่ตรงกฎไหน → บอทไม่ตอบ',
};

// which box of the map a test message ended in
function stageKeyOf(run) {
  if (!run) return null;
  switch (run.stage) {
    case 'school-ask':
      return 'supplies';
    case 'order':
      return run.which === 'documentAsk' ? 'document' : 'order';
    case 'rule':
    case 'off':
      return run.matched ? 'rule:' + run.matched : 'fallback';
    default:
      return run.stage;
  }
}

function runLabel(run) {
  const key = stageKeyOf(run);
  if (!key) return '';
  if (key.startsWith('rule:')) {
    const i = S.content.rules.findIndex((r) => r.id === key.slice(5));
    const r = S.content.rules[i];
    return r ? `กฎที่ ${i + 1}: ${r.name}${run.stage === 'off' ? ' (ตั้งไว้ไม่ตอบ)' : ''}` : 'กฎที่เพิ่งลบ';
  }
  return STAGE_NAMES[key] || key;
}

function renderTestLine() {
  const el = $('#test-result');
  if (!el) return;
  el.replaceChildren();
  if (!S.lastRun) {
    el.append(h('span', { class: 'muted' }, 'พิมพ์ข้อความลูกค้า กด “ทดสอบ” จะบอกว่าตรงกับกฎไหน และโทรศัพท์ทางขวาจะแสดงคำตอบ'));
    return;
  }
  const silent = S.lastRun.stage === 'fallback' || S.lastRun.stage === 'off';
  el.append(h('span', { class: 'matched' + (silent ? ' none' : '') }, icon(silent ? 'silent' : 'check', 14), h('b', {}, silent ? 'บอทไม่ตอบ' : 'ตรงกับ'), ' ', runLabel(S.lastRun)));
}

function testBar() {
  const input = h('input', { id: 'test-input', class: 'input', type: 'text', placeholder: 'ข้อความของลูกค้า เช่น ร้านเปิดกี่โมงคะ', autocomplete: 'off' });
  const go = () => {
    const v = input.value;
    if (!v.trim()) return;
    sendUser(v);
    input.select();
  };
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.isComposing) {
      e.preventDefault();
      go();
    }
  });
  return h(
    'div',
    { class: 'testbar' },
    h('div', { class: 'testrow' }, h('label', { for: 'test-input' }, 'ทดสอบข้อความ'), input, h('button', { type: 'button', class: 'btn btn-primary', onclick: go }, icon('play', 14), 'ทดสอบ')),
    h('div', { id: 'test-result', class: 'test-result' })
  );
}

function replySummary(replies) {
  const rs = replies || [];
  if (!rs.length) return 'ยังไม่มีคำตอบ';
  if (rs[0].type === 'silent') return 'ไม่ตอบ';
  const first = rs[0];
  const t = first.type === 'card' ? first.title || first.text : first.type === 'text' ? first.text : first.type === 'image' ? first.url : first.type === 'sticker' ? `${first.packageId}/${first.stickerId}` : first.altText;
  return `${rs.length} คำตอบ · ${TYPE_INFO[first.type]?.tag || first.type}${t ? ' “' + clip(String(t).replace(/\s+/g, ' '), 26) + '”' : ''}`;
}

function flowStages(shop) {
  const c = shop.contact;
  const sup = shop.schoolSupplies;
  const sys = (key, name, when, out, go) => ({ key, name, when, out, sys: true, go });
  const first = [
    sys('thanks', 'ขอบคุณ', 'ลูกค้าพิมพ์ ขอบคุณ / thanks / ขอบใจ', 'การ์ดตอบรับ', 'texts'),
    sys('school', 'ลูกค้าบอกชื่อโรงเรียน', 'หลังบอทถามว่าโรงเรียนไหน', 'การ์ดลิงก์รายการอุปกรณ์', 'schools'),
    sys('supplies', sup.label, 'พิมพ์ ' + (sup.keywords || []).slice(0, 3).join(' / '), 'ถามว่าโรงเรียนไหน', 'schools'),
    sys('contact', 'คุยกับแอดมิน', 'กดปุ่ม ' + [c.button, ...(c.buttonAliases || [])].filter(Boolean).join(' / '), 'การ์ดเลือกชื่อแอดมิน', 'texts'),
    sys('document', 'ส่งเอกสารโครงการ', 'พิมพ์ ' + (c.documentWords || []).slice(0, 3).join(' / '), 'การ์ดเลือกชื่อแอดมิน', 'texts'),
    sys('order', 'สั่งงาน / สั่งทำ', 'พิมพ์ ' + (c.orderWords || []).slice(0, 4).join(' / ') + ((c.orderWords || []).length > 4 ? ' …' : ''), 'การ์ดเลือกชื่อแอดมิน', 'texts'),
  ];
  const rules = (S.content.rules || []).map((r, i) => ({ key: 'rule:' + r.id, name: `${i + 1}. ${r.name}`, rule: r, i }));
  const last = [
    sys('ask', 'ถามที่บอทไม่รู้', 'พิมพ์ ' + (c.askWords || []).slice(0, 3).join(' / ') + ((c.askWords || []).length > 3 ? ' …' : ''), 'การ์ดเลือกชื่อแอดมิน', 'texts'),
    sys('greeting', 'ทักทาย / เมนู', 'พิมพ์ สวัสดี / เมนู', 'การ์ดเมนู', 'texts'),
    sys('fallback', 'เรื่องอื่น ๆ', 'ไม่ตรงอะไรเลย', 'ไม่ตอบ (แอดมินเห็นแชทแล้วตอบเอง)', null),
  ];
  return [...first, ...rules, ...last];
}

function renderFlow(root) {
  const shop = currentShop();
  const hitKey = stageKeyOf(S.lastRun);
  root.append(
    h('p', { class: 'sub' }, 'บอทไล่ดูจากบนลงล่าง เจอที่ตรงก่อนก็ตอบเลยและหยุด กล่องสีเทาคือขั้นตอนของระบบ กล่องสีขาวคือกฎของร้าน (คลิกเพื่อแก้ไข)')
  );
  if (S.lastRun) root.append(h('div', { class: 'hitbar' }, icon('check', 14), h('b', {}, 'ข้อความ “' + clip(S.lastRun.text, 30) + '” '), runLabel(S.lastRun)));
  const list = h('div', { class: 'flow' });
  list.append(h('div', { class: 'flow-start' }, h('i', { class: 'live-dot' }), h('div', {}, h('b', {}, 'ข้อความเข้า'), h('small', {}, 'จากแชท LINE ของลูกค้า'))));
  let passed = Boolean(hitKey);
  for (const st of flowStages(shop)) {
    const hit = st.key === hitKey;
    if (hit) passed = false;
    const node = h('div', { class: 'flow-row' + (hit ? ' hit' : '') + (passed ? ' passed' : '') + (!hit && hitKey && !passed ? ' skipped' : '') });
    const left = h('button', { type: 'button', class: 'stage' + (st.sys ? ' sys' : ' own') + (st.rule && st.rule.id === S.sel ? ' sel' : ''), onclick: () => (st.rule ? selectRuleFromFlow(st.rule.id) : st.go ? ((S.view = st.go), renderTabs(), renderCenter()) : null) });
    if (st.rule) {
      const r = st.rule;
      left.append(
        h('div', { class: 'stage-name' }, st.name, r.enabled === false ? h('span', { class: 'tag t-off' }, 'ปิดอยู่') : null),
        h('div', { class: 'tags' }, typesOf(r).map((t) => h('span', { class: 'tag t-' + t }, TYPE_INFO[t]?.tag || t)), h('span', { class: 'tag t-match' }, r.match === 'exact' ? 'ตรงทั้งข้อความ' : 'มีคำนี้')),
        h('div', { class: 'rule-kw' }, icon('key', 13), h('span', {}, r.keywords.length ? clip(r.keywords.join(', '), 60) : 'ยังไม่มีคำ'))
      );
    } else {
      left.append(h('div', { class: 'stage-name' }, st.name), h('div', { class: 'stage-when' }, st.when));
    }
    const right = h('div', { class: 'out' + (st.rule && st.rule.replies[0]?.type === 'silent' ? ' silent' : '') }, st.rule ? replySummary(st.rule.replies) : st.out);
    node.append(left, h('div', { class: 'arrow' }, h('span', {}, 'ตรง'), h('i')), right);
    list.append(h('div', { class: 'nomatch' + (hit ? ' stop' : '') }, hit ? '' : 'ไม่ตรง ↓'), node);
  }
  root.append(list);
}

function selectRuleFromFlow(id) {
  S.sel = id;
  S.view = 'editor';

  renderCenter();
}

function renderSchools(root) {
  const sup = S.content.schoolSupplies;
  sup.schools = Array.isArray(sup.schools) ? sup.schools : [];
  sup.keywords = Array.isArray(sup.keywords) ? sup.keywords : [];
  const q = S.schoolQ.trim().toLowerCase();
  const rows = sup.schools.map((s, i) => ({ s, i })).filter(({ s }) => !q || (s.name || '').toLowerCase().includes(q) || (s.aliases || []).some((a) => a.toLowerCase().includes(q)));

  const table = h('div', { class: 'schools' });
  for (const { s, i } of rows) {
    s.aliases = Array.isArray(s.aliases) ? s.aliases : [];
    const bad = !/^https:\/\//i.test(String(s.link || '')) || !String(s.name || '').trim();
    table.append(
      h(
        'div',
        { class: 'school' + (bad ? ' bad' : '') },
        h('div', { class: 'school-main' }, textInput(s.name, (v) => ((s.name = v), updateHeader()), { placeholder: 'ชื่อโรงเรียน เช่น โรงเรียนบ้านกอก', maxlength: '80' }), textInput(s.link, (v) => ((s.link = v), updateHeader()), { placeholder: 'https://www.nattagroup.com/…' })),
        h('div', { class: 'school-alias' }, chipsInput(s.aliases, () => updateHeader(), { placeholder: 'ชื่อเรียกอื่น (ไม่บังคับ)', max: 10, maxLen: 60 })),
        h(
          'button',
          {
            type: 'button',
            class: 'iconbtn danger',
            title: 'ลบโรงเรียนนี้',
            onclick: () => {
              sup.schools.splice(i, 1);
              updateHeader();
              renderCenter();
            },
          },
          icon('trash', 15)
        )
      )
    );
  }
  if (!rows.length) table.append(h('p', { class: 'note' }, sup.schools.length ? 'ไม่พบโรงเรียนที่ค้นหา' : 'ยังไม่มีโรงเรียน กด “เพิ่มโรงเรียน”'));

  const search = textInput(S.schoolQ, (v) => {
    S.schoolQ = v;
    renderCenterKeepFocus('#school-q');

function exportText() {
  const out = clone(S.content);
  out.rules = Engine.cleanRules(out.rules);
  return JSON.stringify(out, null, 2);
}

function renderJson(root) {
  const area = h('textarea', { class: 'input area mono', rows: '18', spellcheck: 'false', id: 'json-area' });
  area.value = exportText();
  const msg = h('p', { class: 'f-hint' }, 'ข้อมูลทั้งหมดที่หน้านี้บันทึก (กฎ โรงเรียน ข้อความ) คัดลอกเก็บไว้เป็นสำรอง หรือวางข้อมูลที่เคยสำรองไว้แล้วกด “นำเข้า”');
  root.append(
    h('div', { class: 'ed-head' }, h('div', {}, h('h2', {}, 'Export / Import JSON'), h('p', { class: 'sub' }, 'สำรองและย้ายข้อมูลของบอท'))),
    area,
    msg,
    h(
      'div',
      { class: 'toolbar' },
      h('button', { type: 'button', class: 'btn btn-ghost', onclick: () => copyText(area.value) }, icon('copy', 15), 'คัดลอก'),
      h(
        'button',
        {
          type: 'button',
          class: 'btn btn-primary',
          onclick: () => {
            try {
              const j = JSON.parse(area.value);
              if (!j || typeof j !== 'object' || Array.isArray(j)) throw new Error('ต้องเป็น JSON แบบ { … }');
              const next = clone(S.content);
              if (Array.isArray(j.rules)) next.rules = Engine.cleanRules(j.rules);
              if (j.schoolSupplies && Array.isArray(j.schoolSupplies.schools)) next.schoolSupplies = j.schoolSupplies;
              for (const k of ['greeting', 'thanks']) if (typeof j[k] === 'string') next[k] = j[k];
              if (j.holiday && typeof j.holiday === 'object') next.holiday = j.holiday;
              if (j.contact && typeof j.contact === 'object') next.contact = { ...next.contact, ...pick(j.contact, CONTACT_KEYS) };
              S.content = next;
              if (!ruleById(S.sel)) S.sel = next.rules[0]?.id ?? null;
              touch();
              renderCenter();
              toast('นำเข้าแล้ว (ยังไม่บันทึกจนกว่าจะกดบันทึก)');
            } catch (e) {
              msg.textContent = 'นำเข้าไม่ได้: ' + clip(e.message, 100);
              msg.className = 'f-hint bad';
            }
          },
        },
        icon('save', 15),
        'นำเข้า'
      )
    )
  );
}

function updateHeader() {
  const pill = $('#conn-pill');
  if (pill) {
    const [cls, text] = { ready: ['ok', 'เชื่อมฐานข้อมูลแล้ว'], connecting: ['info', 'กำลังเชื่อม…'], offline: ['warn', 'โหมดดูตัวอย่าง'], error: ['bad', 'เชื่อมไม่สำเร็จ'] }[S.conn] || ['info', ''];
    pill.className = 'pill ' + cls;
    pill.textContent = text;
  }
  const retry = $('#conn-retry');
  if (retry) retry.hidden = S.busy || (S.conn !== 'error' && S.conn !== 'offline');
  const box = $('#actions');
  if (!box) return;
  const d = dirty();
  const canSave = d && S.conn === 'ready' && !S.busy;
  box.replaceChildren();
  if (d) box.append(h('span', { class: 'dirty' }, h('i'), 'ยังไม่ได้บันทึก'));
  if (d) box.append(h('button', { type: 'button', class: 'btn btn-ghost btn-sm', disabled: S.busy, onclick: discardChanges, title: 'ทิ้งสิ่งที่แก้ กลับไปใช้ที่บันทึกไว้' }, 'ยกเลิกที่แก้'));
  box.append(h('button', { type: 'button', class: 'btn btn-ghost btn-sm', disabled: S.conn !== 'ready', onclick: openHistory, title: 'เวอร์ชันที่เคยบันทึก' }, icon('history', 15), h('span', { class: 'lbl' }, 'ประวัติ')));
  if (S.saveConfirm && canSave) {
    box.append(
      h('span', { class: 'savecfm' }, 'บอทจะใช้คำตอบนี้ทันที'),
      h('button', { type: 'button', class: 'btn btn-primary', onclick: doSave }, icon('check', 16), 'ยืนยันบันทึก'),
      h('button', { type: 'button', class: 'btn btn-ghost btn-sm', onclick: () => ((S.saveConfirm = false), updateHeader()) }, 'ยกเลิก')
    );
  } else {
    box.append(
      h(
        'button',
        {
          type: 'button',
          id: 'save-btn',
          class: 'btn btn-primary',
          disabled: !canSave,
          title: S.conn !== 'ready' ? 'ต้องเชื่อมฐานข้อมูลร้านก่อนถึงจะบันทึกได้' : d ? '' : 'ยังไม่มีอะไรเปลี่ยน',

        },
        icon('save', 16),
        'บันทึกการตั้งค่า'
      )
    );
  }

function askSave() {
  if (!dirty() || S.conn !== 'ready') return;
  const bad = (S.content.rules || []).filter((r) => problemsOf(r).length);
  if (bad.length) toast(`มี ${bad.length} กฎที่ยังไม่ครบ บอทจะข้ามกฎเหล่านั้น`, 'warn');
  S.saveConfirm = true;
  updateHeader();
  clearTimeout(askSave.t);
  askSave.t = setTimeout(() => {
    S.saveConfirm = false;
    updateHeader();
  }, 8000);
}

async function doSave() {
  S.busy = true;
  S.saveConfirm = false;
  updateHeader();
  try {
    await saveAll('จากหน้า Reply Studio');
    toast('บันทึกแล้ว บอทใช้คำตอบใหม่ทันที');
  } catch (e) {
    toast(explain(e), 'bad');
  }
  S.busy = false;
  renderAll();
}

function discardChanges() {
  S.content = contentFrom(S.row, S.bot);
  if (!ruleById(S.sel)) S.sel = S.content.rules[0]?.id ?? null;
  renderAll();
  toast('กลับไปใช้ที่บันทึกไว้แล้ว', 'info');
}

async function reloadAll() {
  S.busy = true;
  renderAll();
  await connect();
  S.busy = false;
  renderAll();
}

function renderCenter() {
  const root = $('#center');
  if (!root) return;
  const hadFocus = document.activeElement?.id === 'test-input';
  const typed = $('#test-input')?.value ?? S.testText ?? '';
  S.testText = typed;
  root.replaceChildren();
  const withTest = S.view === 'editor' || S.view === 'flow';
  if (withTest) {
    const bar = testBar();
    $('input', bar).value = typed;
    $('input', bar).addEventListener('input', (e) => (S.testText = e.target.value));
    root.append(bar);
  }
  const body = h('div', { class: 'center-body view-' + S.view });
  root.append(body);
  if (!S.content) {
    body.append(h('div', { class: 'empty-state' }, h('p', {}, 'กำลังเชื่อมต่อฐานข้อมูลร้าน…')));
    return;
  }
  switch (S.view) {
    case 'flow':
      renderFlow(body);
      break;
    case 'texts':
      renderTexts(body);
      break;
    case 'schools':
      renderSchools(body);
      break;
    case 'bot':
      renderBotView(body);
      break;
    case 'json':
      renderJson(body);
      break;
    default:
      renderEditor(body);
  }
  if (withTest) renderTestLine();
  if (hadFocus) $('#test-input')?.focus();
}

function renderPane() {
  const app = $('#app');
  if (app) app.dataset.pane = S.pane;
  const nav = $('#bottomnav');
  if (nav) {
    nav.replaceChildren(
      ...[
        ['rules', 'กฎ', 'card'],
        ['center', 'แก้ไข', 'text'],
        ['sim', 'ตัวอย่าง', 'bot'],

  root.append(
    h(
      'div',
      { class: 'modal-back', onclick: (e) => e.target === e.currentTarget && close() },
      h(
        'div',
        { class: 'modal', role: 'dialog', 'aria-label': 'ประวัติการบันทึก' },
        h('div', { class: 'modal-head' }, h('h3', {}, 'ประวัติการบันทึก'), h('button', { type: 'button', class: 'iconbtn', onclick: close, title: 'ปิด' }, icon('x', 16))),
        h('p', { class: 'f-hint' }, 'ทุกครั้งที่บันทึก ระบบเก็บ “ก่อนบันทึก” ไว้ให้ กดใช้เวอร์ชันนี้เพื่อย้อนกลับ (20 ครั้งล่าสุด)'),
        h('ul', { class: 'hist' }, items)
      )
    )
  );
}

// ---- start --------------------------------------------------------------------------------------------------------------

function renderAll() {
  updateHeader();
  renderTabs();
  renderPalette();
  renderRules();
  renderCenter();
  renderSim();
  renderPane();
  renderModal();
}

function wireKeys() {
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
      e.preventDefault();
      askSave();
    } else if (e.key === 'Escape' && S.modal) {
      S.modal = null;
      renderModal();
    }
  });
}

async function startStudio() {
  skeleton();
  wireKeys();
  updateHeader();
  renderTabs();
  renderPalette();
  renderPane();
  renderCenter();
  await connect();
  renderAll();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', startStudio);
else startStudio();

</script>
