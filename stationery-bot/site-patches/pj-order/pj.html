<style>

const thDate=iso=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||''));return m?(+m[3])+' '+TM[+m[2]-1]+' '+String((+m[1]+543)%100).padStart(2,'0'):''}
const todayIso=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const kb=n=>n>=1048576?(n/1048576).toFixed(n>=10485760?0:1)+' MB':Math.max(1,Math.round(n/1024))+' KB'
const extOf=n=>{const m=/\.([a-z0-9]{1,5})$/i.exec(String(n||''));return m?m[1].toLowerCase():''}
const phoneOk=t=>{let d=String(t||'').replace(/[^\d+]/g,'');if(d.startsWith('+66'))d='0'+d.slice(3);return /^0\d{8,9}$/.test(d)}
const schShort=s=>String(s||'').replace(/^\s*(?:โรงเรียน|รร\.?)\s*/,'').trim()
const norm=s=>schShort(s).toLowerCase().replace(/[\s.\-–()]/g,'')
let toastT=0
function toast(t){let d=$('.toast');if(!d){d=document.createElement('div');d.className='toast';d.setAttribute('role','status');document.body.appendChild(d)}d.textContent=t;d.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{d.hidden=true},2600)}

async function call(action,body,tries){
  for(let k=0;k<(tries||2);k++){
    try{
      const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY},body:JSON.stringify(Object.assign({action,at:S.at},body||{}))})
      const j=await r.json().catch(()=>null)
      if(j)return j
    }catch(e){}
    await new Promise(r=>setTimeout(r,700))
  }
  return {error:'network'}
}
function loadSdk(){return new Promise((ok,no)=>{if(window.liff)return ok();const s=document.createElement('script');s.src=LIFF_SDK;s.onload=ok;s.onerror=()=>no(new Error('sdk'));document.head.appendChild(s)})}
function screen(html){app.innerHTML=html;window.scrollTo(0,0);const t=$('.toast');if(t)t.hidden=true}
function topbar(trial){return `<div class="top"><img src="icons/shop-192.png" alt=""><div><b>ร้านนัฐภรณ์ เชียงกลาง</b><small>สั่งสินค้าเพื่อออกเอกสาร</small></div>${trial?'<span class="tr">โหมดทดลอง · เฉพาะแอดมิน</span>':''}</div>`}
function fail(title,text,retry){screen(topbar()+`<div class="card msg"><img src="c/ch-pack.png" alt=""><h1>${E(title)}</h1><p>${E(text)}</p>${retry?'<button class="btn2" id="retry" type="button">ลองใหม่</button>':''}</div>`);const b=$('#retry');if(b)b.onclick=()=>location.reload()}

// ---------- เริ่ม: ล็อกอิน LINE → ดึงข้อมูลผู้สั่ง ----------
async function boot(){
  const cfg=await call('cfg',{},3)
  if(!cfg||!cfg.liff_id){fail('เปิดหน้านี้ไม่ได้ตอนนี้','ลองใหม่อีกครั้ง หรือส่งไฟล์ในแชท LINE ร้านได้เลยค่ะ',true);return}
  S.oa=String(cfg.oa||'').trim()
  try{await loadSdk();await liff.init({liffId:cfg.liff_id})}catch(e){fail('เปิดหน้านี้ไม่ได้ตอนนี้','เช็กอินเทอร์เน็ตแล้วลองใหม่อีกครั้งนะคะ',true);return}
  if(!liff.isLoggedIn()){try{liff.login({redirectUri:location.origin+location.pathname})}catch(e){fail('เข้าสู่ระบบ LINE ไม่สำเร็จ','ลองเปิดจากปุ่มในเมนูแชท LINE ร้านอีกครั้งนะคะ',true)}return}
  try{if(/[?&](code|liffClientId|liffRedirectUri)=/.test(location.search))history.replaceState(null,'',location.pathname)}catch(e){}
  S.at=liff.getAccessToken()||''
  const me=await call('me',{},3)
  if(me&&me.error==='login'){try{liff.logout()}catch(e){}try{liff.login({redirectUri:location.origin+location.pathname})}catch(e){}return}
  if(!me||!me.ok){fail('โหลดข้อมูลไม่สำเร็จ','เช็กอินเทอร์เน็ตแล้วลองใหม่อีกครั้งนะคะ',true);return}
  S.me=me
  S.line.name=me.line_name||''
  try{const pr=await liff.getProfile();S.line.name=pr.displayName||S.line.name;S.line.pic=pr.pictureUrl||''}catch(e){}
  try{const fr=await liff.getFriendship();S.line.friend=!!(fr&&fr.friendFlag)}catch(e){S.line.friend=null}
  if(me.mode==='off'){screen(topbar()+`<div class="card msg"><img src="c/ch-pack.png" alt=""><h1>ยังไม่เปิดรับทางหน้านี้</h1><p>ตอนนี้ส่งเอกสารโครงการในแชท LINE ร้านได้เลยค่ะ ส่งรูปหรือไฟล์มาในแชท แล้วแอดมินจะติดต่อกลับนะคะ 🙏</p><button class="btn2" type="button" id="back">กลับไปที่แชท LINE</button></div>`);$('#back').onclick=backToChat;return}
  const t=me.teacher||{}
  S.t={school_id:t.school_id||null,school_name:t.school_name||'',name:t.name||(S.line.name||''),phone:t.phone||''}
  S.editT=!t.saved
  form()
}

function stepsDone(){
  const t1=!!(schShort(S.t.school_name).length>=2&&S.t.name.trim().length>=2&&phoneOk(S.t.phone))
  const t2=!!(S.add||S.p.name.trim().length>=2)
  const t3=!S.add&&S.items.length>0
  const t4=S.files.length>0||!!(S.me.chat&&S.me.chat.count)
  return [S.add?true:t1,t2,t3,t4]
}
function missing(){
  const [a,b,c,d]=stepsDone(),m=[]
  if(!a)m.push(!(schShort(S.t.school_name).length>=2)?'โรงเรียน':!(S.t.name.trim().length>=2)?'ชื่อผู้สั่ง':'เบอร์โทร')
  if(!b)m.push('ชื่อโครงการ')
  if(!c&&!d)m.push(S.add?'ไฟล์เอกสาร':'รายการสินค้า หรือ ไฟล์เอกสาร')
  return m
}

  return `<section class="line" id="lineBar">${av}<div><small>ชื่อไลน์ของคุณ</small><b>${E(nm)}</b>${st}</div></section>`
}

  paintT();paintFiles();paintItems();paintCats();paintProds();wire();wirePicker();refresh()

function paintT(){
  const box=$('#c1b'),me=S.me,T=S.t
  if(!box)return
  if(me.teacher&&me.teacher.saved&&!S.editT){
    box.innerHTML=`<div class="who"><div><b>${E(T.name)}</b><small>${E(T.school_name)}</small><small>โทร ${E(T.phone)}</small></div><button type="button" class="ed" id="edT">แก้ไข</button></div>`
    $('#edT').onclick=()=>{S.editT=true;paintT();refresh();const i=$('#tSchool');if(i)i.focus()}
    return
  }
  box.innerHTML=`
    <div class="f sug" id="fs"><span>โรงเรียน</span><input class="in" id="tSchool" autocomplete="off" placeholder="พิมพ์ชื่อโรงเรียน" value="${E(T.school_name)}" role="combobox" aria-expanded="false" aria-autocomplete="list"><ul id="schL" hidden role="listbox"></ul><div class="errt">เลือกหรือพิมพ์ชื่อโรงเรียนค่ะ</div></div>
    <div class="row2">
      <label class="f" id="fn"><span>ชื่อผู้สั่ง</span><input class="in" id="tName" maxlength="80" autocomplete="name" placeholder="ชื่อ-นามสกุล" value="${E(T.name)}"><div class="errt">พิมพ์ชื่อค่ะ</div></label>
      <label class="f" id="fph"><span>เบอร์โทร</span><input class="in" id="tPhone" type="tel" inputmode="tel" maxlength="16" autocomplete="tel" placeholder="08x-xxx-xxxx" value="${E(T.phone)}"><div class="errt">เบอร์ 10 หลักค่ะ</div></label>
    </div>`
  const si=$('#tSchool'),ul=$('#schL')
  const list=()=>{
    const q=norm(si.value),all=(S.me.schools||[])
    const hits=q?all.filter(s=>norm(s.name).includes(q)).slice(0,8):all.slice(0,8)
    const exact=hits.some(s=>norm(s.name)===q)
    ul.innerHTML=hits.map(s=>`<li><button type="button" data-id="${E(s.id)}">${E(s.name)}</button></li>`).join('')+(q&&!exact?`<li class="new"><button type="button" data-new="1">ใช้ชื่อ “${E(/^(โรงเรียน|รร)/.test(si.value.trim())?si.value.trim():'โรงเรียน'+si.value.trim())}”</button></li>`:'')
    ul.hidden=!ul.innerHTML;si.setAttribute('aria-expanded',String(!ul.hidden))
  }
  si.addEventListener('focus',list)
  si.addEventListener('input',()=>{S.t.school_name=si.value;S.t.school_id=null;list();refresh()})
  si.addEventListener('blur',()=>setTimeout(()=>{ul.hidden=true;si.setAttribute('aria-expanded','false')},180))
  ul.addEventListener('mousedown',e=>e.preventDefault())
  ul.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return
    if(b.dataset.id){const s=(S.me.schools||[]).find(x=>x.id===b.dataset.id);if(s){S.t.school_id=s.id;S.t.school_name=s.name;si.value=s.name}}
    else{const v=si.value.trim();S.t.school_id=null;S.t.school_name=/^(โรงเรียน|รร)/.test(v)?v:'โรงเรียน'+v;si.value=S.t.school_name}
    ul.hidden=true;refresh();const n=$('#tName');if(n&&!n.value)n.focus()})
  $('#tName').addEventListener('input',e=>{S.t.name=e.target.value;refresh()})
  $('#tPhone').addEventListener('input',e=>{S.t.phone=e.target.value;refresh()})
}
function wire(){
  const pn=$('#pName');if(pn)pn.addEventListener('input',e=>{S.p.name=e.target.value;refresh()})
  const nd=$('#pNeed'),nb=$('#noDate')
  if(nd)nd.addEventListener('change',()=>{S.p.need=nd.value||'';nb.classList.toggle('on',!S.p.need);$('#needTh').textContent=S.p.need?'ต้องการ: '+thDate(S.p.need):'กดช่องวันที่เพื่อเลือก'})
  if(nb)nb.onclick=()=>{S.p.need='';nd.value='';nb.classList.add('on');$('#needTh').textContent='กดช่องวันที่เพื่อเลือก'}
  const bu=$('#pBudget');if(bu){bu.addEventListener('input',()=>{S.p.budget=bu.value.replace(/[^\d.]/g,'')});bu.addEventListener('blur',()=>{const n=Number(S.p.budget);if(S.p.budget&&isFinite(n))bu.value=n.toLocaleString('en-US',{maximumFractionDigits:2})});bu.addEventListener('focus',()=>{if(S.p.budget)bu.value=S.p.budget})}
  ;['fCam','fPick'].forEach(id=>{const i=$('#'+id);if(i)i.addEventListener('change',()=>{addFiles([...(i.files||[])]);i.value=''})})
  $('#go').onclick=send
  const ax=$('#addX');if(ax)ax.onclick=()=>{S.add=null;form()}
  app.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const d=(S.me.recent||[]).find(x=>x.id===b.dataset.add);if(d){S.add=d;form();setTimeout(()=>{const c=$('#c4');if(c)c.scrollIntoView({behavior:'smooth',block:'start'})},60)}})
}
function refresh(){
  const d=stepsDone()
  app.querySelectorAll('#steps [data-s]').forEach(s=>s.classList.toggle('done',d[+s.dataset.s]))
  ;['c1','c2','c3','c4'].forEach((id,i)=>{const c=$('#'+id);if(c)c.classList.toggle('ok',d[i])})
  const m=missing(),go=$('#go'),nd=$('#need')
  if(go){go.disabled=S.busy;const l=go.querySelector('span');if(l)l.textContent='ส่งเอกสารให้ร้าน'+(!S.add&&S.items.length?' ('+S.items.length+' รายการ)':'')}
  if(nd)nd.textContent=m.length?'ยังขาด: '+m.join(' · '):(S.add?'พร้อมส่งไฟล์เพิ่มแล้ว':'พร้อมส่งแล้ว ✓')
  if(S.touched){
    const T=S.t
    const mark=(id,bad)=>{const f=$('#'+id);if(f){f.classList.toggle('bad',bad);const i=f.querySelector('.in');if(i)i.classList.toggle('err',bad)}}
    if($('#tSchool')){mark('fs',schShort(T.school_name).length<2);mark('fn',T.name.trim().length<2);mark('fph',!phoneOk(T.phone))}
    if(!S.add)mark('fp',S.p.name.trim().length<2)
  }
}

// ---------- เลือกสินค้า (แตะ + เพื่อเลือก · เลือกเป็นหมวด · ค้นหาได้ · พิมพ์ชื่อเองได้) ----------
const kq=s=>String(s||'').toLowerCase().replace(/\s+/g,'')
const imgOf=p=>p&&p.i&&S.catImg?S.catImg+p.i:''
const qtyOf=id=>{const x=S.items.find(i=>i.id&&i.id===id);return x?x.qty:0}
async function loadCat(){
  if(S.cat||S.catBusy)return
  S.catBusy=true;paintProds()
  const r=await call('products',{},2)
  S.catBusy=false
  if(r&&r.ok){
    S.catImg=r.img||''
    S.cat=(r.items||[]).map(p=>Object.assign(p,{k:kq(p.n),cn:p.c||'อื่นๆ'}))
    const m=new Map();S.cat.forEach(p=>m.set(p.cn,(m.get(p.cn)||0)+1))
    S.cats=[...m.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'th'))
  }
  paintCats();paintProds()
}
function paintCats(){
  const box=$('#cats');if(!box)return
  if(!S.cat){box.innerHTML='';return}
  box.innerHTML=`<button type="button" data-g=""${S.cg?'':' class="on"'}>ทั้งหมด<span>${S.cat.length}</span></button>`+S.cats.map(([n,c])=>`<button type="button" data-g="${E(n)}"${S.cg===n?' class="on"':''}>${E(n)}<span>${c}</span></button>`).join('')
}
function paintProds(){
  const ul=$('#prods'),more=$('#more');if(!ul)return
  const q=S.q.trim()
  let h='',hits=[],total=0
  if(S.cat){
    const toks=q.toLowerCase().split(/\s+/).map(kq).filter(Boolean)
    hits=S.cat.filter(p=>(!S.cg||p.cn===S.cg)&&toks.every(t=>p.k.includes(t)))
    total=hits.length
    const k=toks.join('')
    if(toks.length)hits.sort((a,b)=>(b.k.startsWith(k)-a.k.startsWith(k))||(a.n.length-b.n.length))
    hits=hits.slice(0,S.lim)
  }
  const custom=q.length>=2&&!(S.cat||[]).some(p=>kq(p.n)===kq(q))
  if(custom)h+=`<li><button type="button" class="pr new" data-c="1"><span class="t">${ICON.pen}</span><span class="x1"><b>+ เพิ่ม “${E(q)}” เอง</b><small>ไม่มีในร้าน? พิมพ์เองได้ ร้านจะหาให้</small></span><span class="ad">+</span></button></li>`
  if(!S.cat)h+=`<li class="pst">${S.catBusy?'กำลังโหลดสินค้าในร้าน…':'โหลดรายการสินค้าไม่ได้ · พิมพ์ชื่อสินค้าเองได้'}</li>`
  else if(!hits.length)h+=`<li class="pst">ไม่พบสินค้าที่ค้นหา${q.length>=2?' · แตะ “เพิ่ม” ด้านบนเพื่อพิมพ์ชื่อเอง':''}</li>`
  h+=hits.map(p=>{const u=imgOf(p),n=qtyOf(p.id);return `<li><button type="button" class="pr${n?' on':''}" data-p="${E(p.id)}"><span class="t"${u?` style="background-image:url('${E(u)}')"`:''}>${u?'':ICON.box}</span><span class="x1"><b>${E(p.n)}</b><small>${E([p.u?'หน่วย: '+p.u:'',p.cn].filter(Boolean).join(' · '))}</small></span><span class="ad">${n?`<i>${n}</i>`:'+'}</span></button></li>`}).join('')
  ul.innerHTML=h
  if(more){more.hidden=!(S.cat&&total>S.lim);more.textContent='ดูเพิ่ม ('+(total-S.lim)+' รายการ)'}
}
function markRows(){
  const ul=$('#prods');if(!ul)return
  ul.querySelectorAll('button.pr[data-p]').forEach(b=>{const n=qtyOf(b.dataset.p);b.classList.toggle('on',n>0);const a=b.querySelector('.ad');if(a)a.innerHTML=n?`<i>${n}</i>`:'+'})
}
function addItem(it){
  const max=(S.me&&S.me.max_items)||100
  const same=S.items.find(x=>it.id?x.id===it.id:(!x.id&&kq(x.name)===kq(it.name)))
  if(same){same.qty=Math.min(100000,same.qty+1);toast('เพิ่มจำนวน “'+same.name+'” เป็น '+same.qty)}
  else{if(S.items.length>=max){toast('ใส่ได้ไม่เกิน '+max+' รายการค่ะ');return};S.items.push(Object.assign({qty:1},it));toast('เพิ่ม “'+it.name+'” แล้ว')}
  paintItems();markRows();refresh()
}
function wirePicker(){
  const qi=$('#qProd');if(!qi)return
  let tm=0
  qi.addEventListener('input',()=>{S.q=qi.value;S.lim=40;clearTimeout(tm);tm=setTimeout(paintProds,120)})
  qi.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();qi.blur()}})
  $('#cats').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.cg=b.dataset.g||'';S.lim=40;paintCats();paintProds();$('#prods').scrollTop=0})
  $('#prods').addEventListener('click',e=>{const b=e.target.closest('button.pr');if(!b)return
    if(b.dataset.p){const p=(S.cat||[]).find(x=>x.id===b.dataset.p);if(p)addItem({id:p.id,name:p.n,unit:p.u,img:imgOf(p)})}
    else if(b.dataset.c){const v=S.q.replace(/\s+/g,' ').trim().slice(0,160);if(v.length>=2){addItem({id:'',name:v,unit:'',img:''});S.q='';qi.value='';paintProds()}}})
  $('#more').onclick=()=>{S.lim+=40;paintProds()}
}
// ตารางรายการ — หน้าตาแบบใบส่งของ/ใบเสร็จ (ลำดับ · รายการ · จำนวน/หน่วย) · ro = อ่านอย่างเดียว (หน้าหลังส่งแล้ว)
function itemsTable(list,ro){
  return `<table class="tb"><colgroup><col class="c-no"><col><col class="c-q"></colgroup><thead><tr><th class="no">#</th><th>รายการ</th><th class="q">จำนวน</th></tr></thead><tbody>`
    +list.map((x,i)=>`<tr data-i="${i}"><td class="no">${i+1}</td><td class="nm"><b>${E(x.name)}</b>${x.id?(x.unit?`<small>หน่วย: ${E(x.unit)}</small>`:''):'<small class="cu">พิมพ์เอง · ร้านจะหาให้</small>'}${ro?'':`<button type="button" class="rm" data-rm="${i}" aria-label="ลบ ${E(x.name)}">ลบรายการ</button>`}</td><td class="q">${ro?`<b class="qn">${x.qty}</b>`:`<div class="qty"><button type="button" data-d="-1" aria-label="ลดจำนวน">−</button><input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" value="${x.qty}" aria-label="จำนวน ${E(x.name)}"><button type="button" data-d="1" aria-label="เพิ่มจำนวน">+</button></div>`}<span class="u">${E(x.unit||'ชิ้น')}</span></td></tr>`).join('')
    +`</tbody><tfoot><tr><td colspan="3">รวม ${list.length} รายการ · ราคา ร้านใส่ให้ภายหลัง</td></tr></tfoot></table>`
}
function paintItems(){
  const box=$('#tbl');if(!box)return
  const n=S.items.length,c=$('#rcN');if(c)c.textContent=n?n+' รายการ':''
  if(!n){box.innerHTML='<div class="ie">ยังไม่มีรายการ · แตะ + ที่สินค้าด้านบนเพื่อเลือก</div>';return}
  box.innerHTML=itemsTable(S.items,false)
  box.querySelectorAll('tr[data-i]').forEach(tr=>{
    const x=S.items[+tr.dataset.i],inp=tr.querySelector('input')
    tr.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{x.qty=Math.max(1,Math.min(100000,(x.qty||1)+Number(b.dataset.d)));inp.value=x.qty;markRows()})
    inp.addEventListener('input',()=>{const v=parseInt(inp.value.replace(/\D/g,''),10);if(v>=1){x.qty=Math.min(100000,v);markRows()}})
    inp.addEventListener('blur',()=>{inp.value=x.qty})
    tr.querySelector('[data-rm]').onclick=()=>{S.items.splice(+tr.dataset.i,1);paintItems();markRows();refresh()}
  })
}

// ---------- ไฟล์ ----------
const IMG=/^image\/(jpeg|png|webp|heic|heif)$/i
async function shrink(f){
  if(!IMG.test(f.type||'')||f.size<1.8*1048576||!window.createImageBitmap)return f
  try{
    const bm=await createImageBitmap(f,{imageOrientation:'from-image'})
    const k=Math.min(1,2400/Math.max(bm.width,bm.height)),w=Math.round(bm.width*k),h=Math.round(bm.height*k)
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(bm,0,0,w,h)
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.86))
    if(!b||b.size>=f.size)return f
    const nm=String(f.name||'รูป').replace(/\.[a-z0-9]{1,5}$/i,'')+'.jpg'
    return new File([b],nm,{type:'image/jpeg'})
  }catch(e){return f}
}
let fid=0
async function addFiles(list){
  const max=S.me.max_files||20,exts=S.me.exts||[]
  for(const f0 of list){
    if(S.files.length>=max){toast('ส่งได้ครั้งละไม่เกิน '+max+' ไฟล์ค่ะ');break}
    let name=f0.name||('รูป-'+Date.now()+'.jpg')
    if(!extOf(name)&&/^image\//.test(f0.type||''))name+='.'+(f0.type.split('/')[1]||'jpg').replace('jpeg','jpg')
    if(!exts.includes(extOf(name))){toast('ไฟล์ “'+name+'” ส่งไม่ได้ · รับรูป, PDF, Word, Excel ค่ะ');continue}
    const it={id:++fid,raw:f0,file:null,name,size:f0.size,type:f0.type||'',st:'prep',pct:0,path:'',url:''}
    S.files.push(it);paintFiles();refresh()
    it.file=await shrink(f0);it.name=it.file===f0?name:it.file.name;it.size=it.file.size
    if(it.size>(S.me.max_size||26214400)){S.files=S.files.filter(x=>x!==it);toast('ไฟล์ “'+name+'” ใหญ่เกิน 25 MB ค่ะ');paintFiles();refresh();continue}
    if(/^image\//.test(it.file.type||'')){try{it.url=URL.createObjectURL(it.file)}catch(e){}}
    it.st='ready';paintFiles();refresh()
  }
}
function paintFiles(){
  const ul=$('#files');if(!ul)return
  ul.innerHTML=S.files.map(it=>{
    const ext=extOf(it.name).toUpperCase()
    const s=it.st==='done'?'<small class="ok">✓ ส่งแล้ว</small>':it.st==='up'?`<small>กำลังส่ง ${it.pct}%</small>`:it.st==='err'?'<small class="bad">ส่งไม่สำเร็จ — กดส่งอีกครั้ง</small>':it.st==='prep'?'<small>กำลังเตรียม…</small>':`<small>${kb(it.size)}</small>`
    return `<li data-f="${it.id}"><span class="th"${it.url?` style="background-image:url('${E(it.url)}')"`:''}>${it.url?'':E(ext||'ไฟล์')}</span><span class="tx"><b>${E(it.name)}</b>${s}</span>${S.busy||it.st==='done'?'':`<button type="button" class="x" data-x="${it.id}" aria-label="ลบไฟล์ ${E(it.name)}">✕</button>`}${it.st==='up'?`<span class="bar" style="width:${it.pct}%"></span>`:''}</li>`
  }).join('')
  ul.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{const it=S.files.find(x=>x.id===+b.dataset.x);if(it&&it.url)try{URL.revokeObjectURL(it.url)}catch(e){};S.files=S.files.filter(x=>x.id!==+b.dataset.x);paintFiles();refresh()})
}
function putFile(it,url,onp){
  return new Promise(ok=>{
    const x=new XMLHttpRequest()
    x.open('PUT',url)
    x.setRequestHeader('x-upsert','false');x.setRequestHeader('apikey',SUPABASE_KEY)
    x.upload.onprogress=e=>{if(e.lengthComputable)onp(Math.round(e.loaded*100/e.total))}
    x.onload=()=>ok(x.status>=200&&x.status<300||x.status===409)
    x.onerror=()=>ok(false);x.ontimeout=()=>ok(false);x.timeout=180000
    const fd=new FormData();fd.append('cacheControl','3600');fd.append('',it.file,it.name)
    x.send(fd)
  })
}

// ---------- ส่ง ----------
function overlay(t,s,p){let o=$('.ov');if(!o){o=document.createElement('div');o.className='ov';o.innerHTML='<div class="box" role="status"><div class="spin"></div><b></b><small></small><div class="pb"><i></i></div></div>';document.body.appendChild(o)}o.querySelector('b').textContent=t;o.querySelector('small').textContent=s||'';o.querySelector('.pb i').style.width=(p||0)+'%'}
const unOverlay=()=>{const o=$('.ov');if(o)o.remove()}
async function send(){
  if(S.busy)return
  S.touched=true;refresh()
  const m=missing()
  if(m.length){toast('ยังขาด: '+m.join(' · '));const sd=stepsDone(),first=!sd[0]?'c1':!sd[1]?'c2':S.add?'c4':'c3';const c=$('#'+first);if(c)c.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(S.files.some(f=>f.st==='prep')){toast('รอเตรียมไฟล์สักครู่นะคะ');return}
  S.busy=true;refresh();paintFiles()
  const snap=S.add?[]:S.items.map(x=>({id:x.id,name:x.name,qty:x.qty,unit:x.unit}))
  try{
    const todo=S.files.filter(f=>f.st!=='done')
    if(todo.length){
      overlay('กำลังส่งเอกสาร…','เตรียมส่ง '+todo.length+' ไฟล์',3)
      const sg=await call('sign',{sess:S.sess,files:todo.map(f=>({name:f.name,size:f.size,mime:f.file.type||''}))})
      if(!sg||!sg.ok){throw new Error(sg&&sg.error==='closed'?'closed':sg&&sg.error==='login'?'login':sg&&(sg.error==='type'||sg.error==='size')?'file:'+(sg.name||''):'net')}
      S.sess=sg.sess
      const total=todo.reduce((a,f)=>a+f.size,0)||1
      let doneB=0
      for(let k=0;k<todo.length;k++){
        const it=todo[k],u=sg.uploads[k]
        it.st='up';it.pct=0;it.path=u.path;paintFiles()
        overlay('กำลังส่งเอกสาร…','ไฟล์ '+(k+1)+' จาก '+todo.length,Math.round(doneB*96/total)+3)
        const good=await putFile(it,u.url,p=>{it.pct=p;const li=app.querySelector(`[data-f="${it.id}"] small`);if(li)li.textContent='กำลังส่ง '+p+'%';const b=app.querySelector(`[data-f="${it.id}"] .bar`);if(b)b.style.width=p+'%';overlay('กำลังส่งเอกสาร…','ไฟล์ '+(k+1)+' จาก '+todo.length,Math.round((doneB+it.size*p/100)*96/total)+3)})
        it.st=good?'done':'err';doneB+=it.size;paintFiles()
        if(!good)throw new Error('upload')
      }
    }
    overlay('กำลังบันทึก…','อีกนิดเดียวค่ะ',98)
    const r=await call('submit',{sess:S.sess,add_to:S.add?S.add.id:undefined,teacher:{school_id:S.t.school_id,school_name:S.t.school_name,name:S.t.name,phone:S.t.phone},project:{name:S.p.name,need_date:S.p.need||null,budget:S.p.budget||null},files:S.files.filter(f=>f.st==='done').map(f=>({path:f.path,name:f.name})),items:S.add?undefined:S.items.map(x=>({id:x.id||undefined,name:x.name,qty:x.qty}))})
    if(!r||!r.ok){
      if(r&&r.error==='invalid'){unOverlay();S.busy=false;S.editT=true;form();S.touched=true;refresh();toast('ข้อมูลยังไม่ครบ ตรวจช่องสีแดงอีกครั้งนะคะ');return}
      throw new Error(r&&r.error==='closed'?'closed':r&&r.error==='busy'?'busy':r&&r.error==='login'?'login':r&&r.error==='no_files'?'empty':'net')
    }
    unOverlay();done(r.doc,r.added,snap)
  }catch(e){
    unOverlay();S.busy=false;paintFiles();refresh()
    const w=String(e&&e.message||'')
    if(w==='login'){toast('หมดเวลาเข้าสู่ระบบ กำลังเข้าใหม่…');setTimeout(()=>{try{liff.login({redirectUri:location.origin+location.pathname})}catch(x){}},900)}
    else if(w==='closed')toast('ตอนนี้ร้านปิดรับทางหน้านี้ ส่งไฟล์ในแชท LINE ร้านได้เลยค่ะ')
    else if(w==='busy')toast('ส่งถี่เกินไป รอสักครู่แล้วลองใหม่นะคะ')
    else if(w==='empty')toast('เลือกรายการสินค้า หรือแนบไฟล์อย่างน้อย 1 อย่างนะคะ')
    else if(w.startsWith('file:'))toast('ไฟล์ “'+w.slice(5)+'” ส่งไม่ได้ ลบออกแล้วลองใหม่นะคะ')
    else toast('ส่งไม่สำเร็จ เช็กอินเทอร์เน็ตแล้วกด “ส่งเอกสารให้ร้าน” อีกครั้งค่ะ')
  }
}
function done(d,added,snap){
  S.busy=false
  const rows=[['ชื่อไลน์',S.line.name||'-'],['โครงการ',d.project_name],['โรงเรียน',d.school_name],['ผู้สั่ง',d.teacher_name],['ต้องการ',d.need||'ยังไม่กำหนด'],['งบประมาณ',d.budget!=null?Number(d.budget).toLocaleString('en-US',{maximumFractionDigits:2})+' บาท':'ไม่ระบุ']].concat((d.file_count||!(snap&&snap.length))?[['ไฟล์',(d.file_count||0)+' ไฟล์']]:[])
  screen(topbar(S.me.mode==='trial')+`<section class="card msg done"><img src="c/ch-wave.png" alt=""><h1>${added?'เพิ่มไฟล์ให้แล้ว ✓':'ร้านได้รับเอกสารแล้ว ✓'}</h1><p>เลขที่เอกสาร</p><span class="big">${E(d.doc_no)}</span>
    <div class="rows">${rows.map(r=>`<span>${r[0]}</span><b>${E(r[1]||'-')}</b>`).join('')}</div>
    ${snap&&snap.length?`<div class="rc"><div class="rh"><b>รายการสินค้า</b><span>${snap.length} รายการ</span></div>${itemsTable(snap,true)}</div>`:''}
    <p style="margin-top:14px">แอดมินจะตรวจเอกสาร${d.items?' ใส่ราคาสินค้า':''} แล้วติดต่อกลับทาง LINE นะคะ 🙏<br>ลืมไฟล์? กลับมาหน้านี้แล้วกด “เพิ่มไฟล์” ได้เลย</p>
    <button class="go" type="button" id="back" style="margin-top:16px">กลับไปที่แชท LINE</button>
    <button class="btn2" type="button" id="again">สั่งรายการใหม่</button></section>`)
  $('#back').onclick=backToChat
  $('#again').onclick=async()=>{S.files=[];S.items=[];S.sess='';S.add=null;S.p={name:'',need:'',budget:''};S.touched=false;S.q='';S.cg='';S.lim=40;const me=await call('me',{},2);if(me&&me.ok){S.me=me;const t=me.teacher||{};S.t={school_id:t.school_id||null,school_name:t.school_name||'',name:t.name||(S.line.name||''),phone:t.phone||''};S.editT=!t.saved}form()}
}
function backToChat(){try{if(window.liff&&liff.isInClient&&liff.isInClient()){liff.closeWindow();return}}catch(e){}try{window.close()}catch(e){}toast('กดปุ่ม ✕ หรือย้อนกลับ เพื่อกลับไปที่แชทได้เลยค่ะ')}
function mineHtml(){
  const L=(S.me.recent||[]).slice(0,5)
  if(!L.length||S.add)return ''
  return `<section class="card mine"><h2>เอกสารที่ส่งแล้ว</h2><ul>${L.map(d=>`<li><div class="h"><span class="no">${E(d.doc_no)}</span><b>${E(d.project_name)}</b><span class="s ${E(d.status)}">${E(d.status_th||'ร้านได้รับแล้ว')}</span></div><small>${d.sent_at?E(new Date(d.sent_at).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'})):''} · ${d.file_count||0} ไฟล์${d.items?' · '+d.items+' รายการสินค้า':''}</small><div class="a"><button type="button" data-add="${E(d.id)}">+ เพิ่มไฟล์</button>${d.view?`<a href="${E(d.view)}">ดูเอกสารที่ร้านส่งให้</a>`:''}</div></li>`).join('')}</ul></section>`
}
boot().catch(()=>fail('เปิดหน้านี้ไม่ได้ตอนนี้','ลองใหม่อีกครั้ง หรือส่งไฟล์ในแชท LINE ร้านได้เลยค่ะ',true))
</script>
