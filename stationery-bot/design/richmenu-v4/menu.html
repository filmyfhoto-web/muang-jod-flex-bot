<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<!-- Rich menu v4 (5 buttons). Top: the 3 original buttons (top-row.png, cropped at y=804, pixel-identical). Bottom: 2 wider cards in the same style.
     Canvas 2500x1301 (LINE allows width 800-2500, height >= 250, ratio >= 1.45). Numbers measured from the original picture:
     margins 57 · gap 38 · card height 610 (row 1) / 420 (row 2) · corner radius 54 · circle 190 · title 75px bold · caption 43px · font Loma. -->
<style>
  :root{--navy:#12335f;--card:#fbf6ee;--ink:#5e6d80}
  html,body{margin:0;padding:0}
  body{width:2500px;height:1301px;background:var(--navy);position:relative;overflow:hidden;font-family:"Loma",sans-serif}
  #top{position:absolute;left:0;top:0;width:2500px;height:804px;background:url(top-row.png) 0 0 no-repeat}
  .card{position:absolute;top:823px;height:420px;background:var(--card);border-radius:54px;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
  .a{left:57px;width:1174px}.b{left:1269px;width:1174px}
  .ic{flex:none;width:190px;height:190px;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .ic svg{width:104px;height:104px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .tx{margin-left:56px;color:var(--navy)}
  .t{font-weight:700;font-size:75px;line-height:1.2;white-space:nowrap}
  .c{font-size:43px;line-height:1.3;color:var(--ink);margin-top:14px;white-space:nowrap}
</style></head>
<body>
  <div id="top"></div>
  <div class="card a">
    <div class="ic" style="background:#0f8b8d"><svg viewBox="0 0 24 24"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg></div>
    <div class="tx"><div class="t">อุปกรณ์</div><div class="c">เครื่องเขียน · สมุด · อุปกรณ์สำนักงาน</div></div>
  </div>
  <div class="card b">
    <div class="ic" style="background:#b0306c"><svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg></div>
    <div class="tx"><div class="t">บริการงานพิมพ์</div><div class="c">ป้ายไวนิล · ถ่ายเอกสาร · ตรายาง</div></div>
  </div>
</body></html>
