<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6d3b8c">
  <title>แก้ไขรายการ — ม่วงจดให้</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/app.css">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body><main class="app-shell">
  <header class="topbar"><div class="brand"><img class="brand-logo" src="/assets/mamung-card.png" alt="มะม่วง"><div><strong>แก้ไขรายการ</strong><small>ม่วงจดให้</small></div></div><span class="test-badge" data-test-badge>TEST MODE</span></header>
  <section class="content"><h1 class="page-title">แก้ไขรายการ</h1><p class="page-subtitle">บันทึกแล้วการ์ดและหน้าสรุปจะใช้ข้อมูลใหม่</p><div id="state"></div>
    <form id="edit-form" class="panel form-grid" hidden>
      <label>รายละเอียด<input id="description" maxlength="200" required></label>
      <label>ประเภทรายการ<div class="segmented"><label><input type="radio" name="type" value="expense"><span class="expense">รายจ่าย</span></label><label><input type="radio" name="type" value="income"><span class="income">รายรับ</span></label></div></label>
      <label>หมวด<input id="category" maxlength="80" required></label>
      <label>จำนวนเงิน<input id="amount" type="number" inputmode="decimal" min="0.01" max="100000000" step="0.01" required></label>
      <label>ช่องทางชำระ<select id="payment"><option value="">ไม่ระบุ</option><option>เงินสด</option><option>โอนเงิน</option><option>พร้อมเพย์</option><option>บัตร</option><option>TrueMoney</option><option>TikTokPay</option></select></label>
      <label>วันที่และเวลา<input id="occurred-at" type="datetime-local" required></label>
      <div class="actions-stack"><button id="save" class="btn primary" type="submit">บันทึกการแก้ไข</button><button id="delete" class="btn ghost" type="button">ยกเลิกรายการนี้</button></div>
    </form>
  </section>
  <nav class="bottom-nav"><a href="/"><span>💬</span>ทดลอง</a><a href="/summary"><span>⌂</span>สรุป</a><a href="/categories"><span>◔</span>หมวด/งบ</a><a class="active" href="/transactions"><span>☷</span>รายการ</a></nav>
</main><script type="module" src="/edit.js"></script></body></html>
