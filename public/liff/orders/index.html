<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ม่วงจดให้ — แชตและออเดอร์</title>
<meta name="theme-color" content="#35486E" />
<link rel="apple-touch-icon" href="/brand/ui/app-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* โทนกรมท่า ขาว ครีม ฟ้าอ่อน — ปุ่มน้อย อ่านง่าย */
  :root {
    color-scheme: light;
    --navy: #35486E;
    --navy-deep: #2C3C5E;
    --navy-tint: #E9EDF5;
    --cream: #FBF6EA;
    --cream-deep: #F4ECD8;
    --sky: #E6F1FB;
    --sky-line: #C9DDF0;
    --white: #FFFFFF;
    --ink: #1F2B45;
    --muted: #5E6E8C;
    --faint: #8A97AE;
    --line: #DDE3EC;
    --green: #2E7D5B;
    --green-tint: #E4F0EA;
    --amber: #9A6A12;
    --amber-tint: #FBF0D6;
    --red: #B3402F;
    --red-tint: #F8E6E2;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans Thai", "Segoe UI", sans-serif;
    background: var(--cream);
    color: var(--ink);
    font-size: 14px;
    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .55; }
  img { max-width: 100%; }

  /* ---------- หัวหน้า ---------- */
  .top {
    background: var(--navy);
    color: #fff;
    padding: 12px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .top h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .2px; }
  .top .sub { font-size: 12px; color: #C6CFE0; }
  .channels { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .chan {
    font-size: 11.5px; padding: 4px 10px; border-radius: 999px;
    background: rgba(255,255,255,.12); color: #E9EEF8; white-space: nowrap;
  }
  .chan i { font-style: normal; color: #F5C77A; }

  /* ---------- สามคอลัมน์ / แท็บมือถือ ---------- */
  .app {
    display: grid;
    grid-template-columns: 300px minmax(0, 1fr) 420px;
    gap: 12px;
    padding: 12px;
    align-items: start;
  }
  .panel {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 12px;
    min-width: 0;
    overflow: hidden;
  }
  .tabs { display: none; }

  /* ---------- คอลัมน์ซ้าย: รายชื่อแชต ---------- */
  .side { display: flex; flex-direction: column; max-height: calc(100vh - 110px); min-height: 480px; }
  .side-head { padding: 12px; border-bottom: 1px solid var(--hair, #EEF1F6); display: flex; flex-direction: column; gap: 10px; }
  .search {
    width: 100%; height: 38px; border: 1px solid var(--line); border-radius: 9px;
    padding: 0 12px; background: var(--white); font-size: 13.5px;
  }
  .search:focus, .field input:focus, .field select:focus, .field textarea:focus, .composer textarea:focus {
    outline: 2px solid var(--sky-line); outline-offset: 0;
  }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line); background: var(--white); border-radius: 999px;
    padding: 4px 10px; font-size: 12px; color: var(--muted);
  }
  .chip b { font-weight: 700; margin-left: 3px; color: var(--navy); }
  .chip[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
  .chip[aria-pressed="true"] b { color: #fff; }
  .newcust { display: flex; gap: 6px; }
  .newcust input { flex: 1; min-width: 0; height: 34px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; font-size: 13px; }

  .list { overflow-y: auto; flex: 1; }
  .row {
    display: flex; gap: 10px; padding: 11px 12px; border-bottom: 1px solid var(--hair, #EEF1F6);
    width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; align-items: center;
  }
  .row:hover { background: #F7F9FC; }
  .row[aria-selected="true"] { background: var(--sky); }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
    background: var(--navy-tint); color: var(--navy); display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px;
  }
  .row-main { flex: 1; min-width: 0; }
  .row-top { display: flex; align-items: baseline; gap: 6px; }
  .row-name { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .row-time { font-size: 11px; color: var(--faint); white-space: nowrap; }
  .row-prev { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .row-org { font-size: 11px; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge {
    min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--red); color: #fff;
    font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
  }
  .badge.soft { background: var(--navy-tint); color: var(--navy); }

  /* ---------- คอลัมน์กลาง: ห้องแชต ---------- */
  .chat { display: flex; flex-direction: column; min-height: 480px; max-height: calc(100vh - 110px); }
  .chat-head {
    padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center;
  }
  .chat-head .who { flex: 1; min-width: 0; }
  .chat-head .who b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-head .who span { font-size: 12px; color: var(--muted); }
  .notice {
    margin: 8px 12px 0; padding: 8px 10px; border-radius: 8px; font-size: 12px;
    background: var(--amber-tint); color: var(--amber);
  }
  .thread {
    flex: 1; overflow-y: auto; padding: 14px 12px; background: var(--cream);
    display: flex; flex-direction: column; gap: 10px; min-height: 200px;
  }
  .day { align-self: center; font-size: 11px; color: var(--muted); background: var(--white); border-radius: 999px; padding: 3px 10px; border: 1px solid var(--line); }
  .msg { display: flex; flex-direction: column; max-width: 78%; gap: 3px; }
  .msg.in { align-self: flex-start; }
  .msg.out { align-self: flex-end; align-items: flex-end; }
  .bubble {
    background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px;
    white-space: pre-wrap; word-break: break-word; font-size: 13.5px; line-height: 1.5;
  }
  .msg.out .bubble { background: var(--sky); border-color: var(--sky-line); }
  .bubble img { display: block; max-width: 220px; border-radius: 8px; margin-top: 4px; }
  .meta { font-size: 11px; color: var(--faint); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .meta button { border: 0; background: none; color: var(--navy); font-size: 11px; text-decoration: underline; padding: 0; }
  .empty { margin: auto; text-align: center; color: var(--muted); padding: 24px; font-size: 13px; }
  .empty b { display: block; color: var(--navy); font-size: 14px; margin-bottom: 4px; }

  .composer { border-top: 1px solid var(--line); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; background: var(--white); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; align-self: flex-start; }
  .seg button { border: 0; background: var(--white); padding: 6px 12px; font-size: 12.5px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--navy); color: #fff; }
  .composer-row { display: flex; gap: 8px; align-items: flex-end; }
  .composer textarea {
    flex: 1; min-width: 0; min-height: 42px; max-height: 120px; resize: vertical;
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; font-size: 13.5px;
  }
  .iconbtn {
    width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--white);
    font-size: 17px; flex-shrink: 0;
  }
  .btn {
    height: 42px; padding: 0 16px; border-radius: 10px; border: 0; font-weight: 600; font-size: 13.5px;
    background: var(--navy); color: #fff; white-space: nowrap;
  }
  .btn.ghost { background: var(--white); color: var(--navy); border: 1px solid var(--navy); }
  .btn.small { height: 34px; padding: 0 12px; font-size: 12.5px; border-radius: 9px; }
  .btn.danger { background: var(--red); }
  .attach-chip {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; background: var(--sky);
    border: 1px solid var(--sky-line); border-radius: 8px; padding: 4px 8px; align-self: flex-start;
  }
  .attach-chip button { border: 0; background: none; color: var(--red); font-size: 13px; }
  .status-line { font-size: 12px; min-height: 16px; }
  .status-line.ok { color: var(--green); }
  .status-line.err { color: var(--red); }

  /* ---------- คอลัมน์ขวา: ใบสั่งงาน ---------- */
  .order { display: flex; flex-direction: column; max-height: calc(100vh - 110px); min-height: 480px; }
  .order-head { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .order-head h2 { margin: 0; font-size: 15px; }
  .order-body { overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 14px; }
  .order-foot { border-top: 1px solid var(--line); padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; background: var(--white); }
  .dirty { font-size: 11.5px; color: var(--amber); background: var(--amber-tint); border-radius: 999px; padding: 3px 9px; align-self: flex-start; }
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field.full { grid-column: 1 / -1; }
  .field > span { font-size: 12px; color: var(--muted); }
  .field input, .field select, .field textarea {
    height: 36px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; font-size: 13.5px; background: var(--white); min-width: 0; width: 100%;
  }
  .field textarea { height: auto; min-height: 56px; padding: 8px 10px; resize: vertical; }
  .section-title { font-size: 12.5px; font-weight: 700; color: var(--navy); margin: 0 0 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .radio-row { display: flex; gap: 6px; }
  .radio-row label {
    flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; text-align: center; font-size: 12.5px; cursor: pointer; background: var(--white);
  }
  /* วิทยุซ่อนไว้ในป้ายชื่อ — กันกฎของช่องกรอกทั่วไปทำให้มันกว้างเต็มจอ */
  .radio-row label { position: relative; }
  .radio-row input { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; margin: 0; left: 0; top: 0; }
  .radio-row label:has(input:checked) { background: var(--navy-tint); border-color: var(--navy); color: var(--navy); font-weight: 600; }

  .items { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .items th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11.5px; padding: 4px 4px; border-bottom: 1px solid var(--line); }
  .items td { padding: 4px 3px; border-bottom: 1px solid var(--hair, #EEF1F6); vertical-align: middle; }
  .items input { height: 32px; border: 1px solid var(--line); border-radius: 7px; padding: 0 6px; width: 100%; min-width: 0; font-size: 12.5px; background: var(--white); }
  .items .num { text-align: right; }
  .items .qty { width: 56px; }
  .items .unit { width: 58px; }
  .items .price { width: 78px; }
  .items .lt { text-align: right; font-weight: 600; white-space: nowrap; padding-right: 4px; }
  .items .del { border: 0; background: none; color: var(--red); font-size: 15px; padding: 2px 4px; }
  /* ตารางรายการอยู่ในกล่องเลื่อนของตัวเอง — ชื่อสินค้าต้องมีที่พอ ไม่บีบเหลือไม่กี่ตัวอักษร */
  .items-wrap { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
  .items { min-width: 440px; }
  .items td:first-child input { min-width: 150px; }

  .totals { background: var(--cream); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
  .totals .row-line { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; align-items: center; }
  .totals .row-line.big { font-size: 15px; font-weight: 700; color: var(--navy-deep, #2C3C5E); border-top: 1px dashed var(--line); padding-top: 6px; }
  .totals input { width: 130px; height: 32px; text-align: right; border: 1px solid var(--line); border-radius: 7px; padding: 0 8px; background: var(--white); }
  .totals .tax { font-size: 11.5px; color: var(--amber); }

  .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pillset { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { border: 1px solid var(--line); background: var(--white); border-radius: 999px; padding: 5px 10px; font-size: 12px; color: var(--muted); }
  .pill[aria-pressed="true"] { background: var(--navy); color: #fff; border-color: var(--navy); }
  .pill.ok[aria-pressed="true"] { background: var(--green); border-color: var(--green); }
  .pay-line { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12.5px; }
  .pay-line input { width: 110px; height: 32px; border: 1px solid var(--line); border-radius: 7px; padding: 0 8px; }
  .hint { font-size: 11.5px; color: var(--faint); }
  .errors { background: var(--red-tint); color: var(--red); border-radius: 9px; padding: 8px 10px; font-size: 12.5px; }
  .errors div + div { margin-top: 3px; }
  .ok-box { background: var(--green-tint); color: var(--green); border-radius: 9px; padding: 8px 10px; font-size: 12.5px; }
  .warn-box { background: var(--amber-tint); color: var(--amber); border-radius: 9px; padding: 8px 10px; font-size: 12.5px; }
  .orders-pick { display: flex; gap: 6px; align-items: center; }
  .orders-pick select { flex: 1; height: 34px; border: 1px solid var(--line); border-radius: 8px; padding: 0 8px; min-width: 0; }
  .fileline { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .foot-actions { display: flex; gap: 8px; }
  .foot-actions .btn { flex: 1; }
  .foot-note { font-size: 11.5px; color: var(--muted); }

  .state { padding: 28px 16px; text-align: center; color: var(--muted); font-size: 13.5px; }
  .state b { display: block; color: var(--navy); margin-bottom: 4px; }
  .skeleton { height: 58px; margin: 10px 12px; border-radius: 10px; background: linear-gradient(90deg, #EEF1F6, #F7F9FC, #EEF1F6); background-size: 200% 100%; animation: sh 1.2s infinite; }
  @keyframes sh { 0% { background-position: 200% 0 } 100% { background-position: -200% 0 } }

  /* ---------- มือถือ: สลับเป็นแท็บ รายชื่อ / แชต / ออเดอร์ ---------- */
  @media (max-width: 1023px) {
    .app { grid-template-columns: minmax(0, 1fr); padding: 10px; }
    .tabs {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; position: sticky; top: 0; z-index: 5;
      background: var(--cream); padding: 6px 12px 8px;
    }
    .tabs button {
      height: 40px; border: 1px solid var(--line); border-radius: 10px; background: var(--white);
      font-size: 13px; color: var(--muted); font-weight: 600;
    }
    .tabs button[aria-selected="true"] { background: var(--navy); color: #fff; border-color: var(--navy); }
    .app[data-view="list"] .chat-panel, .app[data-view="list"] .order-panel { display: none; }
    .app[data-view="chat"] .side-panel, .app[data-view="chat"] .order-panel { display: none; }
    .app[data-view="order"] .side-panel, .app[data-view="order"] .chat-panel { display: none; }
    .side, .chat, .order { max-height: none; min-height: 0; }
    .thread { min-height: 320px; max-height: 58vh; }
    .order-body { max-height: none; }
    .channels { margin-left: 0; }
    .top h1 { font-size: 16px; }
    .msg { max-width: 88%; }
  }
  @media (min-width: 1024px) {
    .tabs { display: none !important; }
  }
  @media (max-width: 420px) {
    .field-grid, .status-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>แชตและออเดอร์</h1>
    <div class="sub" id="shopLine">ม่วงจดให้ · ร้านของคุณ</div>
  </div>
  <div class="channels" id="channels" aria-label="ช่องทางแชต">
    <span class="chan"><i>●</i> LINE OA · ยังไม่ได้เชื่อมต่อ</span>
    <span class="chan"><i>●</i> Facebook · ยังไม่ได้เชื่อมต่อ</span>
  </div>
</header>

<nav class="tabs" role="tablist" aria-label="เลือกส่วนที่จะดู">
  <button type="button" role="tab" data-tab="list" aria-selected="true">รายชื่อแชต</button>
  <button type="button" role="tab" data-tab="chat" aria-selected="false">แชต</button>
  <button type="button" role="tab" data-tab="order" aria-selected="false">ออเดอร์</button>
</nav>

<main class="app" id="app" data-view="list">
  <!-- ซ้าย: รายชื่อแชต -->
  <section class="panel side side-panel" aria-label="รายชื่อแชตลูกค้า">
    <div class="side-head">
      <input class="search" id="search" type="search" placeholder="ค้นหาชื่อลูกค้า ข้อความ หรือหน่วยงาน…" aria-label="ค้นหา" />
      <div class="chips" id="chips" role="group" aria-label="ตัวกรอง"></div>
      <div class="newcust">
        <input id="newName" type="text" maxlength="200" placeholder="พิมพ์ชื่อลูกค้าใหม่" aria-label="ชื่อลูกค้าใหม่" />
        <button class="btn small ghost" id="newBtn" type="button">เริ่มแชต</button>
      </div>
    </div>
    <div class="list" id="list" aria-live="polite"></div>
  </section>

  <!-- กลาง: ห้องแชต -->
  <section class="panel chat chat-panel" aria-label="ห้องแชต">
    <div class="chat-head" id="chatHead"></div>
    <div id="chatNotice"></div>
    <div class="thread" id="thread" aria-live="polite"></div>
    <div class="composer" id="composer" hidden>
      <div class="seg" role="group" aria-label="ใครเป็นคนพูด">
        <button type="button" id="dirIn" aria-pressed="true">ลูกค้าพิมพ์มา</button>
        <button type="button" id="dirOut" aria-pressed="false">ร้านตอบลูกค้า</button>
      </div>
      <div id="pendingImg"></div>
      <div class="composer-row">
        <label class="iconbtn" style="display:flex;align-items:center;justify-content:center;" title="แนบรูป" aria-label="แนบรูป">
          📎<input id="imgInput" type="file" accept="image/jpeg,image/png" hidden />
        </label>
        <textarea id="msgText" rows="1" maxlength="2000" placeholder="วางข้อความที่ลูกค้าพิมพ์มา หรือข้อความที่ร้านตอบ…" aria-label="ข้อความ"></textarea>
        <button class="btn" id="sendBtn" type="button">บันทึกข้อความ</button>
      </div>
      <div class="status-line" id="sendStatus" role="status"></div>
    </div>
  </section>

  <!-- ขวา: ใบสั่งงาน / คำสั่งซื้อ -->
  <section class="panel order order-panel" aria-label="ใบสั่งงานหรือคำสั่งซื้อ">
    <div class="order-head">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <h2>ใบสั่งงาน / คำสั่งซื้อ</h2>
        <span class="dirty" id="dirtyBadge" hidden>มีการแก้ไขที่ยังไม่บันทึก</span>
      </div>
      <div class="orders-pick" id="orderPick" hidden>
        <select id="orderSelect" aria-label="เลือกออเดอร์"></select>
      </div>
    </div>
    <div class="order-body" id="orderBody"></div>
    <div class="order-foot" id="orderFoot" hidden></div>
  </section>
</main>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
